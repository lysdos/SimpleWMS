# =====================================================
#  SimpleWMS - 后端单元测试
#
#  Gitea Actions 与 GitHub Actions 语法兼容,workflow 放在 .gitea/workflows/。
#
#  ⚠️ 两个前提(缺任一则本文件不会真正运行,且不会有任何报错提示):
#    1) 该 Gitea 实例已启用 Actions 并注册了 act_runner
#       (管理后台 → 站点管理 → Actions,或 site 配置 ENABLED=true 后启动 runner)
#    2) runner 能拉到 actions/checkout 等官方动作:
#       机器能出网即可;纯内网需在 runner 配置里改 DEFAULT_ACTIONS_URL 指向内网镜像
#
#  跑的是 @WebMvcTest 切片测试,不连数据库,所以不需要 MySQL 容器。
# =====================================================

name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 不用 -o(offline):CI 的本地仓库是空的,必须联网拉依赖
      - name: 后端单元测试
        run: mvn -B test
