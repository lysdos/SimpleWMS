# Mosquitto MQTT Broker Configuration
# RFID Demo Project

# Network settings
port 1883
bind_address 192.168.1.168

# Connection settings
max_connections -1
max_keepalive 65535

# Authentication
allow_anonymous false
password_file mosquitto.passwd

# Persistence
persistence true
persistence_location ./
persistence_file mosquitto.db

# Logging
log_dest stdout
log_dest file mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

# WebSockets (optional, for future use)
# listener 8080
# protocol websockets

# Memory limit
max_inflight_messages 20
max_queued_messages 1000

# Message timeout
message_timeout 60