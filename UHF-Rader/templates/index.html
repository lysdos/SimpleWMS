<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UHF RFID 出库扫码终端</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 16px;
        }
        .container { max-width: 1280px; margin: 0 auto; }

        .header {
            display: flex;
            align-items: center;
            gap: 16px;
            background: #1e293b;
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 16px;
        }
        .header h1 { font-size: 20px; color: #f1f5f9; }
        .header .badge {
            padding: 4px 10px; border-radius: 4px; font-size: 12px;
            background: #334155; color: #cbd5e1;
        }
        .header .badge.online { background: #16a34a; color: white; }
        .header .badge.offline { background: #dc2626; color: white; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }

        .card {
            background: #1e293b;
            border-radius: 12px;
            padding: 16px;
        }
        .card h2 { font-size: 15px; color: #f1f5f9; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .card h2 .dot { width: 8px; height: 8px; border-radius: 50%; background: #3b82f6; }
        .field { display: flex; gap: 8px; margin-bottom: 10px; }
        .field input, .field select {
            flex: 1;
            padding: 8px 10px;
            background: #0f172a;
            border: 1px solid #334155;
            color: #e2e8f0;
            border-radius: 6px;
            font-size: 13px;
            font-family: inherit;
        }
        .field input:focus, .field select:focus { outline: none; border-color: #3b82f6; }
        .btn {
            padding: 8px 14px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
        }
        .btn:disabled { background: #475569; cursor: not-allowed; }
        .btn.success { background: #16a34a; }
        .btn.danger  { background: #dc2626; }
        .btn.warn    { background: #f59e0b; }
        .btn + .btn { margin-left: 8px; }

        .orders { max-height: 280px; overflow-y: auto; }
        .order-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 10px; border-radius: 6px; cursor: pointer;
            font-size: 12px;
        }
        .order-row:hover { background: #334155; }
        .order-row.selected { background: #1d4ed8; color: white; }
        .order-row .no { color: #60a5fa; font-weight: 600; }
        .order-row.selected .no { color: #fef3c7; }
        .order-row .qty { color: #94a3b8; }
        .order-row.selected .qty { color: #cbd5e1; }

        #scanList { max-height: 460px; overflow-y: auto; }
        .scan-row {
            display: grid;
            grid-template-columns: 100px 1fr auto;
            gap: 8px;
            align-items: center;
            padding: 8px 10px;
            border-radius: 6px;
            margin-bottom: 4px;
            font-size: 12px;
            background: #0f172a;
        }
        .scan-row.matched   { border-left: 3px solid #16a34a; }
        .scan-row.unmatched { border-left: 3px solid #dc2626; background: #1f1014; }
        .scan-row .epc { color: #60a5fa; font-family: monospace; }
        .scan-row .sku { color: #f1f5f9; font-size: 12px; }
        .scan-row .reason { color: #fca5a5; font-size: 11px; }
        .scan-row .time { color: #94a3b8; font-size: 11px; }
        .scan-row .matched-tag { background: #16a34a; color: white; padding: 1px 6px; border-radius: 3px; font-size: 10px; }
        .scan-row .unmatched-tag { background: #dc2626; color: white; padding: 1px 6px; border-radius: 3px; font-size: 10px; }

        .empty { color: #64748b; text-align: center; padding: 20px; font-size: 12px; }
        .info-line { color: #94a3b8; font-size: 11px; margin-top: 8px; }

        /* 登录卡 */
        .login-card { max-width: 460px; margin: 40px auto; padding: 24px; }
        .login-card .field { margin-bottom: 12px; }
        .login-card .row { display: flex; gap: 8px; align-items: center; }
        .login-card .small { font-size: 11px; color: #94a3b8; margin-top: 6px; }

        /* 期望 EPC 列表(每项 1 行) */
        .expected-list { max-height: 220px; overflow-y: auto; margin-top: 8px;
                         background: #0f172a; border-radius: 6px; padding: 6px; }
        .epc-item {
            display: grid; grid-template-columns: 18px 1fr auto;
            gap: 8px; align-items: center; padding: 4px 6px;
            font-family: monospace; font-size: 11px; color: #cbd5e1;
            border-radius: 4px;
        }
        .epc-item.scanned  { color: #4ade80; background: rgba(22,163,74,0.15); }
        .epc-item .check   { color: #475569; font-weight: 700; }
        .epc-item.scanned .check { color: #16a34a; }

        /* 提交按钮(大,绿色,只读安全色) */
        .commit-bar {
            display: flex; align-items: center; gap: 12px;
            padding: 12px; border-radius: 8px;
            background: #1e293b; margin-top: 12px;
        }
        .commit-bar .ready    { background: #14532d; border: 1px solid #16a34a; }
        .commit-bar .notready { background: #1f2937; border: 1px solid #334155; color: #94a3b8; }
        .commit-btn {
            padding: 12px 20px; font-size: 15px; font-weight: 600;
            background: #16a34a; color: white; border: none; border-radius: 6px;
            cursor: pointer;
        }
        .commit-btn:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; }

        /* 模态结果对话框 */
        .modal-mask {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6);
            display: none; align-items: center; justify-content: center; z-index: 100;
        }
        .modal-mask.show { display: flex; }
        .modal-box {
            background: #1e293b; border-radius: 12px; padding: 24px;
            max-width: 460px; width: 90%; text-align: center;
        }
        .modal-box h3 { font-size: 18px; margin-bottom: 12px; }
        .modal-box .ok  { color: #4ade80; }
        .modal-box .err { color: #fca5a5; }
        .modal-box pre { background: #0f172a; padding: 10px; border-radius: 6px;
                         font-size: 12px; text-align: left; max-height: 200px; overflow: auto;
                         margin: 12px 0; }
    </style>
</head>
<body>
<div class="container">

    <!-- ===== 顶部状态条 ===== -->
    <div class="header">
        <h1>📡 UHF RFID 出库扫码终端</h1>
        <span id="readerBadge" class="badge offline">读卡器未连</span>
        <span id="wmsBadge"   class="badge offline">WMS 未登录</span>
        <span style="flex:1;"></span>
        <span id="userInfo" class="badge" style="display:none;"></span>
        <button id="btnLogout" class="btn warn" style="display:none;" onclick="logout()">退出</button>
        <span class="badge" id="readerInfo">--</span>
    </div>

    <!-- ===== 登录界面(WMS URL + 账号) ===== -->
    <div id="loginView" class="card login-card">
        <h2><span class="dot"></span> 登录 WMS 后台</h2>
        <div class="field">
            <label style="width:90px;color:#94a3b8;">WMS 地址</label>
            <input id="loginWmsUrl" placeholder="例如 http://192.168.1.100:9090" />
        </div>
        <div class="field">
            <label style="width:90px;color:#94a3b8;">账号</label>
            <input id="loginUser" placeholder="WMS 用户名" autocomplete="username" />
        </div>
        <div class="field">
            <label style="width:90px;color:#94a3b8;">密码</label>
            <input id="loginPass" type="password" placeholder="WMS 密码" autocomplete="current-password" />
        </div>
        <div class="row" style="margin-top:8px;">
            <button class="btn success" style="flex:1;" onclick="doLogin()">登录</button>
        </div>
        <div class="small">
            ℹ 第一次部署?把 WMS 所在机器的 IP 填到上面(同局域网用 IP,本机用 localhost)。<br>
            配置会保存在浏览器里,下次自动填。
        </div>
    </div>

    <!-- ===== 主界面(登录后才显示) ===== -->
    <div id="mainView" style="display:none;">

        <div class="grid">
            <!-- 左:出库单选择 + 期望 EPC 列表 -->
            <div class="card">
                <h2><span class="dot"></span> 选择 DRAFT 出库单</h2>
                <div class="field">
                    <input id="kw" placeholder="搜索单号 / 客户..." />
                    <button class="btn" onclick="loadOrders()">刷新</button>
                </div>
                <div id="orders" class="orders">
                    <div class="empty">加载中...</div>
                </div>
                <div class="info-line" id="selectedInfo">当前未选单</div>

                <!-- 已选单时显示"期望 EPC 列表" -->
                <div id="expectedPanel" style="display:none;margin-top:10px;">
                    <div style="display:flex;align-items:center;gap:8px;font-size:12px;color:#cbd5e1;">
                        <span>📋 期望扫码(<span id="expectedTotal">0</span>)</span>
                        <span style="flex:1;"></span>
                        <span style="color:#4ade80;">✓ 已扫 <span id="expectedScanned">0</span></span>
                    </div>
                    <div id="expectedList" class="expected-list">
                        <div class="empty" style="padding:8px;">无</div>
                    </div>
                </div>
            </div>

            <!-- 右:扫码实时事件 -->
            <div class="card">
                <h2><span class="dot"></span> 扫码实时事件 (EPC 24 hex = 12 字节 UHF Gen2)</h2>
                <div class="field">
                    <button id="btnStart" class="btn success" onclick="startRead()">▶ 开始扫码</button>
                    <button id="btnStop"  class="btn danger"  onclick="stopRead()" disabled>⏹ 停止</button>
                    <button id="btnClear" class="btn warn"    onclick="clearScanned()">🗑 清空</button>
                    <span style="flex:1;"></span>
                    <span class="info-line" id="statInfo">已扫 0 / 共 0</span>
                </div>
                <div class="field" style="margin-top:6px;">
                    <input id="manualEpc" maxlength="24" placeholder="手动输入/粘贴 24 位 EPC(回车扫码)"
                           style="font-family:monospace;letter-spacing:1px;"
                           onkeydown="if(event.key==='Enter'){manualScan();event.preventDefault();}" />
                    <button class="btn" onclick="manualScan()">手动扫码</button>
                </div>
                <div id="scanList">
                    <div class="empty">选择出库单后开始扫码</div>
                </div>

                <!-- 提交出库按钮:全部扫完才显示 -->
                <div id="commitBar" class="commit-bar notready" style="display:none;">
                    <span id="commitHint" style="flex:1;font-size:13px;">还需扫 0 件</span>
                    <button id="btnCommit" class="commit-btn" disabled onclick="doCommit()">✓ 提交出库</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 提交结果模态 -->
    <div id="resultModal" class="modal-mask">
        <div class="modal-box">
            <h3 id="resultTitle">提交结果</h3>
            <div id="resultBody" class="ok">提交成功</div>
            <pre id="resultDetail" style="display:none;"></pre>
            <div style="margin-top:16px;">
                <button class="btn" onclick="closeResultModal()">关闭</button>
            </div>
        </div>
    </div>
</div>

<!-- 不用 SocketIO,改用 JS 轮询 -->
<script>
let selectedOrderId = null;
let selectedOrderNo = null;
let scanResults = [];   // [{epc, sku, matched, reason, ts}]
let expectedEpcs = [];  // [{code, sku, productName, ...}] 当前单锁定的 EPC 列表
let _wmsBase = '';      // WMS 后端地址,如 "http://192.168.1.100:9090"
let _currentUser = null; // 当前登录的 WMS 用户

// ====== 启动 ======
async function init() {
    // 加载本地保存的 WMS URL
    const savedUrl = localStorage.getItem('wms_base_url') || '';
    document.getElementById('loginWmsUrl').value = savedUrl;
    if (!savedUrl) {
        // 提示当前页面地址作为默认猜测
        const guess = location.protocol + '//' + location.hostname + ':9090';
        document.getElementById('loginWmsUrl').placeholder = guess;
    }
    // 加载上次登录的账号
    const lastUser = localStorage.getItem('wms_last_user') || '';
    document.getElementById('loginUser').value = lastUser;

    // 如果本地有保存的 token,尝试静默登录
    const savedToken = localStorage.getItem('wms_token');
    const savedWms = localStorage.getItem('wms_base_url');
    if (savedToken && savedWms) {
        _wmsBase = savedWms.replace(/\/+$/, '');
        // 验证 token 是否还有效
        try {
            const r = await fetch(_wmsBase + '/api/products?pageSize=1', {
                headers: { 'Authorization': 'Bearer ' + savedToken }
            });
            if (r.ok) {
                _currentUser = localStorage.getItem('wms_last_user') || 'admin';
                onLoginSuccess(_currentUser, savedToken);
                return;
            }
        } catch (e) {}
    }
}

// ====== 登录 ======
async function doLogin() {
    const wms = (document.getElementById('loginWmsUrl').value || '').trim();
    const user = (document.getElementById('loginUser').value || '').trim();
    const pass = document.getElementById('loginPass').value || '';
    if (!wms) { alert('请填写 WMS 地址'); return; }
    if (!user || !pass) { alert('请填写账号和密码'); return; }
    try {
        const r = await fetch(wms.replace(/\/+$/, '') + '/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: user, password: pass })
        });
        const j = await r.json();
        if (j.code === 0 && j.data && j.data.token) {
            localStorage.setItem('wms_base_url', wms);
            localStorage.setItem('wms_last_user', user);
            localStorage.setItem('wms_token', j.data.token);
            localStorage.setItem('wms_user_role', j.data.role || '');
            _wmsBase = wms.replace(/\/+$/, '');
            _currentUser = user;
            onLoginSuccess(user, j.data.token);
        } else {
            alert('登录失败: ' + (j.message || '未知错误'));
        }
    } catch (e) {
        alert('登录失败: 网络错误 - ' + e.message);
    }
}

function onLoginSuccess(username, token) {
    document.getElementById('loginView').style.display = 'none';
    document.getElementById('mainView').style.display = '';
    document.getElementById('wmsBadge').className = 'badge online';
    document.getElementById('wmsBadge').textContent = 'WMS 已登录';
    document.getElementById('userInfo').textContent = '👤 ' + username;
    document.getElementById('userInfo').style.display = '';
    document.getElementById('btnLogout').style.display = '';
    // 启动轮询
    refreshBadges();
    loadOrders();
    pollScanResults();
    setInterval(refreshBadges, 3000);
    setInterval(pollScanResults, 1500);
}

function logout() {
    if (!confirm('确定退出?')) return;
    localStorage.removeItem('wms_token');
    location.reload();
}

async function refreshBadges() {
    try {
        const r = await fetch('/api/wms/reader-info').then(r => r.json());
        const d = r.data || {};
        const rb = document.getElementById('readerBadge');
        rb.textContent = d.connected ? '读卡器已连' : '读卡器未连';
        rb.className = 'badge ' + (d.connected ? 'online' : 'offline');
        document.getElementById('readerInfo').textContent = d.host + ':' + d.port;

        const ws = await fetch('/api/wms/state').then(r => r.json());
        const wb = document.getElementById('wmsBadge');
        wb.textContent = ws.data && ws.data.loggedIn ? 'WMS 已登录' : 'WMS 未登录';
        wb.className = 'badge ' + (ws.data && ws.data.loggedIn ? 'online' : 'offline');
    } catch (e) { /* ignore */ }
}

async function loadOrders() {
    const kw = document.getElementById('kw').value || '';
    const r = await fetch('/api/wms/draft-orders?keyword=' + encodeURIComponent(kw)).then(r => r.json());
    const orders = (r.data || []);
    const box = document.getElementById('orders');
    if (!orders.length) { box.innerHTML = '<div class="empty">没有 DRAFT 出库单</div>'; return; }
    box.innerHTML = orders.map(o => `
        <div class="order-row ${o.id === selectedOrderId ? 'selected' : ''}" data-id="${o.id}" data-no="${o.orderNo}" onclick="selectOrder(${o.id}, '${o.orderNo}')">
            <div>
                <span class="no">${o.orderNo}</span>
                <span style="margin-left:8px;">${o.customer || '-'}</span>
            </div>
            <div class="qty">${o.itemCount || 0} 行 / ${o.totalQuantity || 0} 件</div>
        </div>
    `).join('');
}

async function selectOrder(id, no) {
    selectedOrderId = id;
    selectedOrderNo = no;
    scanResults = [];
    document.getElementById('selectedInfo').innerHTML = '已选: <b>' + no + '</b>';
    document.getElementById('scanList').innerHTML = '<div class="empty">点击「开始扫码」读取 RFID 标签</div>';
    document.querySelectorAll('.order-row').forEach(r => {
        r.classList.toggle('selected', parseInt(r.dataset.id) === id);
    });
    // 告诉 bridge 选了哪单(给读卡器扫码泵用)
    await fetch('/api/wms/select-order', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({orderId: id})
    });
    // 拉期望 EPC 列表(从 WMS 直接拉,使用当前用户 token)
    await loadExpectedEpcs();
    await pollScanResults();
}

// ===== 加载并渲染"期望扫码"列表(本单锁定的所有 EPC) =====
async function loadExpectedEpcs() {
    if (!selectedOrderId) return;
    const token = localStorage.getItem('wms_token');
    try {
        const r = await fetch(_wmsBase + '/api/outbound/orders/' + selectedOrderId + '/expect', {
            headers: { 'Authorization': 'Bearer ' + token }
        }).then(r => r.json());
        if (r.code === 0) {
            expectedEpcs = r.data || [];
            renderExpectedList();
        } else {
            expectedEpcs = [];
            renderExpectedList();
        }
    } catch (e) {
        expectedEpcs = [];
        renderExpectedList();
    }
}

function renderExpectedList() {
    const panel = document.getElementById('expectedPanel');
    const list = document.getElementById('expectedList');
    const totalEl = document.getElementById('expectedTotal');
    const scannedEl = document.getElementById('expectedScanned');
    if (!expectedEpcs.length) {
        panel.style.display = 'none';
        return;
    }
    panel.style.display = '';
    totalEl.textContent = expectedEpcs.length;
    // 已扫集合(去重)
    const scannedSet = new Set(scanResults.filter(s => s.matched).map(s => s._epc || s.epc));
    scannedEl.textContent = scannedSet.size;
    list.innerHTML = expectedEpcs.map(e => {
        const code = e.code || e.epc;
        const isScanned = scannedSet.has(code);
        return `
        <div class="epc-item ${isScanned ? 'scanned' : ''}">
            <span class="check">${isScanned ? '✓' : '·'}</span>
            <span>${code} <span style="color:#94a3b8;">${e.sku || ''}</span></span>
            <span></span>
        </div>`;
    }).join('');
    updateCommitButton();
}

function updateCommitButton() {
    const bar = document.getElementById('commitBar');
    const btn = document.getElementById('btnCommit');
    const hint = document.getElementById('commitHint');
    const total = expectedEpcs.length;
    const scanned = new Set(scanResults.filter(s => s.matched).map(s => s._epc || s.epc)).size;
    if (total === 0) {
        bar.style.display = 'none';
        return;
    }
    bar.style.display = '';
    const left = total - scanned;
    if (left <= 0) {
        bar.className = 'commit-bar ready';
        hint.innerHTML = '<b style="color:#4ade80;">全部 ' + total + ' 件已扫完,可以提交</b>';
        btn.disabled = false;
    } else {
        bar.className = 'commit-bar notready';
        hint.textContent = '还需扫 ' + left + ' 件';
        btn.disabled = true;
    }
}

// 注:旧的 refreshState 已合并进 pollScanResults,前端只保留一个轮询入口。

function renderScan() {
    const list = [...scanResults].reverse();  // 最新在最上面
    const box = document.getElementById('scanList');
    if (!list.length) { box.innerHTML = '<div class="empty">暂无扫码记录</div>'; return; }
    box.innerHTML = list.map(s => `
        <div class="scan-row ${s.matched ? 'matched' : 'unmatched'}">
            <div>
                <div class="epc">${s._epc || s.epc || '?'}</div>
                <div class="time">${s._ts || ''}</div>
            </div>
            <div>
                ${s.matched
                    ? '<div class="sku">' + (s.sku || '-') + ' <span class="matched-tag">✓ 匹配</span></div><div class="info-line">累计 ' + (s.scannedQty || 0) + ' 件</div>'
                    : '<div class="sku">— <span class="unmatched-tag">✗ 报警</span></div><div class="reason">' + (s.reason || '?') + '</div>'}
            </div>
            <div></div>
        </div>
    `).join('');
    // 同步期望列表(✓状态)+ 提交按钮
    renderExpectedList();
}

// 接收扫码实时事件 — 通过 /api/wms/state 轮询拉取(每 1.5s)
function pollScanResults() {
    return fetch('/api/wms/state').then(r => r.json()).then(r => {
        const d = (r.data || {});
        const newScanned = d.scanned || [];
        // 只在数量或最后一条变化时刷新
        if (newScanned.length !== scanResults.length ||
            (newScanned.length && newScanned[newScanned.length-1]._epc !== (scanResults[scanResults.length-1]||{})._epc)) {
            // 检测新条目,播提示音
            const oldEpcs = new Set(scanResults.map(s => s._epc));
            for (const s of newScanned) {
                if (!oldEpcs.has(s._epc)) {
                    try { s.matched ? beepSuccess() : beepFail(); } catch (e) {}
                }
            }
            scanResults = newScanned;
            renderScan();
            document.getElementById('statInfo').textContent =
                '已扫 ' + d.scannedCount + ' (匹配 ' + scanResults.filter(s => s.matched).length +
                ' / 不匹配 ' + scanResults.filter(s => !s.matched).length + ')';
        }
        // 自动认领:首次连上时,如果有派单且没选单 → 自动选第一个
        if (!selectedOrderId && d.loggedIn && !_dispatchAutoSelectArmed) {
            _dispatchAutoSelectArmed = true;
            autoClaimFirstDispatch();
        }
    }).catch(() => {});
}

async function autoClaimFirstDispatch() {
    // 直接调后端 /api/outbound/dispatches?deviceCode=...
    // 但 UHF 终端本身没有 token,只能通过 bridge 拿
    const r = await fetch('/api/wms/draft-orders').then(r => r.json()).catch(() => ({}));
    const orders = r.data || [];
    if (orders.length) {
        const o = orders[0];
        await selectOrder(o.id, o.orderNo);
    }
}

async function startRead() {
    if (!selectedOrderId) { alert('请先选择 DRAFT 出库单'); return; }
    const r = await fetch('/command/start_read', {method: 'POST'});
    const d = await r.json();
    if (d.success) {
        document.getElementById('btnStart').disabled = true;
        document.getElementById('btnStop').disabled = false;
    } else {
        alert('启动失败: ' + d.error);
    }
}
async function stopRead() {
    const r = await fetch('/command/stop_read', {method: 'POST'});
    const d = await r.json();
    if (d.success) {
        document.getElementById('btnStart').disabled = false;
        document.getElementById('btnStop').disabled = true;
    }
}
function clearScanned() {
    scanResults = [];
    renderScan();
    document.getElementById('statInfo').textContent = '已扫 0';
}

// ===== 声音告警(共享 AudioContext,避免反复创建) =====
let _audioCtx = null;
function _ensureCtx() {
    if (!_audioCtx) {
        try { _audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        catch (e) { return null; }
    }
    // 浏览器策略:用户没交互前 ctx 可能是 suspended,需要 resume
    if (_audioCtx.state === 'suspended') _audioCtx.resume();
    return _audioCtx;
}
function beep(freq, dur, type) {
    const ctx = _ensureCtx();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.value = 0.18;
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start();
    setTimeout(() => { try { osc.stop(); } catch (e) {} }, dur);
}
function beepSuccess() {
    // 扫对:短促 800Hz 100ms "叮"
    beep(800, 100, 'sine');
}
function beepFail() {
    // 扫错:1200Hz 高音 3 短 + 1 长(模仿报警蜂鸣)
    beep(1200, 150, 'square');
    setTimeout(() => beep(1200, 150, 'square'), 200);
    setTimeout(() => beep(1200, 150, 'square'), 400);
    setTimeout(() => beep(1200, 400, 'square'), 600);
}

// ===== 手动扫码(无读卡器时也能演示) =====
async function manualScan() {
    if (!selectedOrderId) { alert('请先选择 DRAFT 出库单'); return; }
    const input = document.getElementById('manualEpc');
    const epc = (input.value || '').trim().toUpperCase();
    if (!epc) { alert('请输入 24 位 EPC'); return; }
    if (epc.length !== 24) { beepFail(); alert('EPC 长度必须 24 位,当前 ' + epc.length); return; }
    // 走 WMS 直连(用当前用户 token),保证扫码人 = 登录人
    const token = localStorage.getItem('wms_token');
    const r = await fetch(_wmsBase + '/api/outbound/orders/' + selectedOrderId + '/scan-epc', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ epc: epc, operator: _currentUser })
    }).then(r => r.json());
    if (r.code === 0 && r.data) {
        const sr = Object.assign({}, r.data, { _epc: epc, _ts: new Date().toLocaleTimeString() });
        scanResults.push(sr);
        if (scanResults.length > 100) scanResults.shift();
        renderScan();
        if (sr.matched) {
            beepSuccess();
            input.value = '';
        } else {
            beepFail();
        }
    } else {
        beepFail();
        alert('扫码失败: ' + (r.message || 'unknown'));
    }
}

// ===== 提交出库(全部扫完才允许) =====
async function doCommit() {
    if (!selectedOrderId) { alert('请先选择出库单'); return; }
    if (!confirm('确认提交出库单 ' + selectedOrderNo + ' ?\n提交后库存将正式扣减,出库单状态变为 COMMITTED。')) return;
    const token = localStorage.getItem('wms_token');
    const btn = document.getElementById('btnCommit');
    btn.disabled = true;
    btn.textContent = '提交中...';
    try {
        const r = await fetch(_wmsBase + '/api/outbound/orders/' + selectedOrderId + '/commit', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + token }
        }).then(r => r.json());
        if (r.code === 0) {
            showResult(true, '✓ 提交成功', '出库单 ' + selectedOrderNo + ' 已正式出库\n共 ' + (r.data.totalQuantity || 0) + ' 件');
            // 清空状态
            selectedOrderId = null;
            selectedOrderNo = null;
            scanResults = [];
            expectedEpcs = [];
            document.getElementById('expectedPanel').style.display = 'none';
            document.getElementById('commitBar').style.display = 'none';
            document.getElementById('selectedInfo').textContent = '当前未选单';
            loadOrders();
        } else {
            showResult(false, '✗ 提交失败', r.message || '未知错误');
        }
    } catch (e) {
        showResult(false, '✗ 提交失败', '网络错误: ' + e.message);
    } finally {
        btn.textContent = '✓ 提交出库';
        btn.disabled = false;
    }
}

function showResult(ok, title, body) {
    const m = document.getElementById('resultModal');
    document.getElementById('resultTitle').textContent = title;
    const b = document.getElementById('resultBody');
    b.className = ok ? 'ok' : 'err';
    b.textContent = body;
    document.getElementById('resultDetail').style.display = 'none';
    m.classList.add('show');
}
function closeResultModal() {
    document.getElementById('resultModal').classList.remove('show');
}
</script>
