<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimpleWMS · UHF RFID 出库扫码终端</title>
    <style>
        /* ============================================================
           SimpleWMS 统一视觉(UHF 出库扫码终端)
           复用 WMS 前端 css/app.css 的设计令牌:主蓝 #2563eb,浅色办公风,
           圆角 6-12px,柔和阴影,统一字体;无任何外部依赖。
           ============================================================ */
        :root {
            /* 品牌色 */
            --c-brand:        #2563eb;
            --c-brand-hover:  #1d4ed8;
            --c-brand-soft:   #eff6ff;
            --c-brand-tint:   rgba(37,99,235,0.08);
            --c-success:      #10b981;
            --c-success-deep: #047857;
            --c-warn:         #f59e0b;
            --c-danger:       #ef4444;
            --c-danger-deep:  #b91c1c;
            /* 中性色 */
            --c-bg:           #f5f7fa;
            --c-bg-elev:      #ffffff;
            --c-bg-soft:      #f8fafc;
            --c-border:       #e5e7eb;
            --c-border-soft:  #eef2f7;
            --c-text:         #1f2937;
            --c-text-2:       #4b5563;
            --c-text-3:       #6b7280;
            --c-text-4:       #9ca3af;
            /* 圆角 */
            --r-sm: 6px; --r-md: 8px; --r-lg: 12px; --r-xl: 16px;
            /* 阴影 */
            --sh-sm: 0 1px 2px rgba(15,23,42,.04), 0 1px 3px rgba(15,23,42,.06);
            --sh-md: 0 1px 3px rgba(15,23,42,.05), 0 4px 12px rgba(15,23,42,.06);
            --sh-lg: 0 8px 24px rgba(15,23,42,.10), 0 4px 8px rgba(15,23,42,.04);
            /* 排版 */
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                         "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
            --font-mono: ui-monospace, "Cascadia Mono", "JetBrains Mono",
                         "SF Mono", Consolas, "Liberation Mono", monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: var(--font-sans);
            background: var(--c-bg);
            color: var(--c-text);
            font-size: 14px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        button { font-family: inherit; }
        :focus-visible { outline: 2px solid var(--c-brand); outline-offset: 2px; border-radius: 4px; }

        /* ============================================================
           顶部 Header(与 WMS 主界面一致)
           ============================================================ */
        .app-header {
            display: flex; align-items: center; gap: 16px;
            padding: 0 24px; height: 60px;
            background: var(--c-bg-elev);
            border-bottom: 1px solid var(--c-border);
            box-shadow: 0 1px 0 rgba(15,23,42,.02);
            position: sticky; top: 0; z-index: 40;
        }
        .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
        .brand .logo {
            width: 34px; height: 34px; flex: 0 0 auto;
            display: inline-flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, var(--c-brand), #60a5fa);
            border-radius: var(--r-md);
            font-size: 18px;
            box-shadow: 0 4px 10px rgba(37,99,235,.30);
        }
        .brand .title { font-size: 17px; font-weight: 600; color: var(--c-text); letter-spacing: .5px; white-space: nowrap; }
        .brand .subtitle { font-size: 12px; color: var(--c-text-3); margin-left: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .header-status { display: flex; align-items: center; gap: 10px; margin-left: auto; flex-wrap: wrap; }
        .meta-chip {
            font-family: var(--font-mono);
            font-size: 12px; color: var(--c-text-3);
            background: var(--c-bg); border: 1px solid var(--c-border);
            border-radius: 999px; padding: 3px 10px;
            white-space: nowrap;
        }
        .user-pill {
            padding: 5px 12px;
            background: var(--c-brand-soft);
            border-radius: 999px;
            font-size: 13px; color: var(--c-brand);
            font-weight: 500;
            white-space: nowrap;
        }

        /* 状态徽标(JS 会设 className = 'badge online' | 'badge offline') */
        .badge {
            display: inline-block; padding: 3px 11px;
            border-radius: 999px; font-size: 12px;
            font-weight: 500; white-space: nowrap;
            border: 1px solid var(--c-border);
            background: var(--c-bg); color: var(--c-text-2);
        }
        .badge.online  { background: #ecfdf5; color: var(--c-success-deep); border-color: #a7f3d0; }
        .badge.offline { background: #fef2f2; color: var(--c-danger-deep);   border-color: #fecaca; }
        #userInfo.badge { background: var(--c-brand-soft); color: var(--c-brand); border: none; }

        /* 语言切换(与 WMS 一致的分段控件) */
        .lang-switch {
            display: inline-flex;
            background: var(--c-bg);
            border: 1px solid var(--c-border);
            border-radius: 999px;
            padding: 2px;
            gap: 0;
        }
        .lang-switch button {
            background: none; border: none; cursor: pointer;
            padding: 3px 12px; font-size: 12.5px;
            color: var(--c-text-3); border-radius: 999px;
            transition: all .18s; font-weight: 500; line-height: 1.5;
        }
        .lang-switch button:hover { color: var(--c-text); }
        .lang-switch button.active {
            background: var(--c-bg-elev);
            color: var(--c-brand);
            box-shadow: var(--sh-sm);
        }

        /* ============================================================
           登录屏(整屏渐变,与 WMS login 一致;登录后 JS 隐藏本层)
           ============================================================ */
        .login-view {
            position: fixed; inset: 0; z-index: 100;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 50%, #3b82f6 100%);
            overflow: hidden;
        }
        .login-view::before, .login-view::after {
            content: ''; position: absolute; border-radius: 50%;
            background: rgba(255,255,255,.06); pointer-events: none;
        }
        .login-view::before { width: 480px; height: 480px; top: -120px; right: -80px; }
        .login-view::after  { width: 360px; height: 360px; bottom: -100px; left: -60px; }

        .login-card {
            background: var(--c-bg-elev);
            padding: 38px 36px 28px;
            border-radius: var(--r-xl);
            width: 430px; max-width: 92vw;
            box-shadow: var(--sh-lg);
            text-align: center;
            position: relative; z-index: 1;
        }
        .login-card .logo-icon {
            width: 60px; height: 60px;
            margin: 0 auto 14px;
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            border-radius: var(--r-lg);
            display: flex; align-items: center; justify-content: center;
            font-size: 30px;
            box-shadow: 0 8px 20px rgba(37,99,235,.30);
        }
        .login-card h1 { margin: 0 0 4px; font-size: 22px; color: var(--c-text); letter-spacing: .5px; }
        .login-card .subtitle { color: var(--c-text-3); margin: 0 0 24px; font-size: 13px; }
        .login-card .field { margin-bottom: 15px; text-align: left; }
        .login-card label { display: block; font-size: 13px; color: var(--c-text-2); font-weight: 500; margin-bottom: 6px; }
        .login-card input {
            display: block; width: 100%;
            padding: 11px 14px; border: 1px solid var(--c-border); border-radius: var(--r-md);
            font-size: 14px; font-family: inherit; background: #fff;
            transition: border-color .18s, box-shadow .18s;
        }
        .login-card input:focus { outline: none; border-color: var(--c-brand); box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
        .login-card .btn-primary { width: 100%; margin-top: 4px; padding: 11px 0; font-size: 15px; }
        .login-card .hint {
            margin-top: 16px; text-align: left;
            background: var(--c-bg); border: 1px solid var(--c-border-soft);
            border-radius: var(--r-md); padding: 10px 12px;
            font-size: 11.5px; line-height: 1.7; color: var(--c-text-3);
        }
        .login-card .login-err { color: var(--c-danger); margin-top: 12px; font-size: 13px; min-height: 0; text-align: left; }
        .login-card .lang-row { margin-top: 14px; display: flex; justify-content: center; }

        /* ============================================================
           主工作区
           ============================================================ */
        .view { max-width: 1360px; margin: 0 auto; padding: 24px; }
        .page-head { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 20px; gap: 16px; flex-wrap: wrap; }
        .page-head h2 { margin: 0; font-size: 20px; font-weight: 600; color: var(--c-text); }
        .page-head .desc { color: var(--c-text-3); font-size: 13px; margin-top: 4px; }

        .work-grid { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.15fr); gap: 18px; align-items: start; }
        @media (max-width: 1020px) { .work-grid { grid-template-columns: 1fr; } }

        .card {
            background: var(--c-bg-elev);
            border-radius: var(--r-lg);
            padding: 18px 20px 20px;
            box-shadow: var(--sh-sm);
            border: 1px solid var(--c-border-soft);
            margin-bottom: 0;
        }
        .card-title {
            font-size: 15px; font-weight: 600; margin-bottom: 14px;
            padding-bottom: 12px; border-bottom: 1px solid var(--c-border-soft);
            color: var(--c-text);
            display: flex; align-items: center; gap: 8px;
        }
        .card-title .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c-brand); }
        .card-title .title-extra { margin-left: auto; font-weight: 500; color: var(--c-text-3); font-size: 12.5px; }

        /* 表单 / 工具条 */
        .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
        .toolbar .grow { flex: 1; }
        .field { display: flex; gap: 8px; align-items: center; }
        input[type=text], input:not([type]), input[type=password] {
            flex: 1;
            padding: 8px 12px; font-size: 14px;
            border: 1px solid var(--c-border); border-radius: var(--r-md);
            background: #fff; outline: none; color: var(--c-text);
            font-family: inherit;
            transition: border-color .18s, box-shadow .18s;
        }
        input:focus { border-color: var(--c-brand); box-shadow: 0 0 0 3px rgba(37,99,235,.12); }

        /* 按钮(WMS 同款) */
        .btn {
            padding: 8px 16px; font-size: 14px;
            background: var(--c-bg-elev); color: var(--c-text-2);
            border: 1px solid var(--c-border); border-radius: var(--r-md);
            cursor: pointer; transition: all .18s;
            display: inline-flex; align-items: center; gap: 5px;
            font-weight: 500; white-space: nowrap; line-height: 1.4;
        }
        .btn:hover { background: var(--c-bg); border-color: var(--c-text-4); color: var(--c-text); }
        .btn:disabled, .btn[disabled] { opacity: .5; cursor: not-allowed; }
        .btn-primary { background: var(--c-brand); color: #fff; border-color: var(--c-brand); }
        .btn-primary:hover { background: var(--c-brand-hover); border-color: var(--c-brand-hover); color: #fff; }
        .btn-success { background: var(--c-success); color: #fff; border-color: var(--c-success); }
        .btn-success:hover { background: #059669; border-color: #059669; color: #fff; }
        .btn-danger { background: var(--c-danger); color: #fff; border-color: var(--c-danger); }
        .btn-danger:hover { background: #dc2626; border-color: #dc2626; color: #fff; }
        .btn-warn { background: var(--c-warn); color: #fff; border-color: var(--c-warn); }
        .btn-warn:hover { background: #d97706; border-color: #d97706; color: #fff; }
        .btn-sm { padding: 5px 12px; font-size: 12.5px; }

        /* 出库单列表 */
        .orders { max-height: 250px; overflow-y: auto; border: 1px solid var(--c-border-soft); border-radius: var(--r-md); }
        .order-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 12px; cursor: pointer;
            font-size: 13px; border-bottom: 1px solid var(--c-border-soft);
            transition: background .15s;
        }
        .order-row:last-child { border-bottom: 0; }
        .order-row:hover { background: var(--c-bg-soft); }
        .order-row.selected { background: var(--c-brand-soft); }
        .order-row.selected::before {
            content: ''; width: 4px; align-self: stretch; border-radius: 2px;
            background: var(--c-brand); margin-right: 4px;
        }
        .order-row .no { color: var(--c-brand); font-weight: 600; font-family: var(--font-mono); font-size: 12.5px; }
        .order-row.selected .no { color: var(--c-brand-hover); }
        .order-row .customer { color: var(--c-text-2); margin-left: 10px; }
        .order-row .qty { color: var(--c-text-3); font-size: 12px; white-space: nowrap; }

        .selected-info {
            display: flex; align-items: center; gap: 6px;
            margin-top: 10px; padding: 8px 12px;
            background: var(--c-bg); border: 1px dashed var(--c-border);
            border-radius: var(--r-md);
            font-size: 13px; color: var(--c-text-2);
        }
        .selected-info b { color: var(--c-brand); font-family: var(--font-mono); font-weight: 600; }
        .empty { text-align: center; color: var(--c-text-4); padding: 24px 12px; font-size: 13px; }

        /* 期望扫码 EPC 清单 */
        .expect-head { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--c-text-2); margin: 14px 0 8px; }
        .expect-head .stat { margin-left: auto; font-weight: 500; white-space: nowrap; }
        .expect-head .stat b { color: var(--c-success-deep); }
        .expect-head .done { color: var(--c-success-deep); }
        .expected-list { max-height: 200px; overflow-y: auto; border: 1px solid var(--c-border-soft); border-radius: var(--r-md); padding: 4px; }
        .epc-item {
            display: grid; grid-template-columns: 18px minmax(0,1fr);
            gap: 8px; align-items: center; padding: 5px 8px;
            font-family: var(--font-mono); font-size: 11.5px; color: var(--c-text-2);
            border-radius: var(--r-sm);
        }
        .epc-item > :nth-child(3) { display: none; }
        .epc-item:hover { background: var(--c-bg-soft); }
        .epc-item .sku { color: var(--c-text-3); font-family: var(--font-sans); margin-left: 8px; font-size: 11px; }
        .epc-item.scanned { color: var(--c-success-deep); background: #f0fdf4; }
        .epc-item .check { color: var(--c-text-4); font-weight: 700; }
        .epc-item.scanned .check { color: var(--c-success); }

        /* 扫码实时列表 */
        #statInfo { font-size: 13px; color: var(--c-text-3); white-space: nowrap; }
        .scan-summary { font-size: 13px; color: var(--c-text-2); }
        .manual-row { margin: 4px 0 12px; }
        #manualEpc { font-family: var(--font-mono); letter-spacing: 1px; font-size: 15px; padding: 10px 12px; }
        #manualEpc::placeholder { font-family: var(--font-sans); letter-spacing: 0; font-size: 12.5px; color: var(--c-text-4); }

        #scanList { max-height: 430px; overflow-y: auto; }
        .scan-row {
            display: grid;
            grid-template-columns: minmax(230px, .9fr) minmax(0, 1.1fr);
            gap: 14px; align-items: center;
            padding: 9px 12px; margin-bottom: 6px;
            border-radius: var(--r-md);
            font-size: 12.5px;
            background: var(--c-bg-soft);
            border: 1px solid var(--c-border-soft);
            border-left-width: 3px;
            animation: row-in .18s ease-out;
        }
        .scan-row > :nth-child(3) { display: none; } /* 兼容 JS 输出的空占位列 */
        @keyframes row-in { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }
        .scan-row.matched   { border-left-color: var(--c-success); background: #f7fdf9; }
        .scan-row.unmatched { border-left-color: var(--c-danger);  background: #fff7f7; }
        .scan-row .epc { color: var(--c-brand-hover); font-family: var(--font-mono); font-size: 12.5px; word-break: break-all; }
        .scan-row .time { color: var(--c-text-4); font-size: 11px; margin-top: 1px; font-family: var(--font-sans); }
        .scan-row .sku { color: var(--c-text); font-size: 12.5px; }
        .scan-row .reason { color: var(--c-danger-deep); font-size: 11.5px; line-height: 1.4; }
        .scan-row .info-line { color: var(--c-text-3); font-size: 11.5px; margin-top: 2px; }
        .tag {
            display: inline-block; padding: 1px 8px; border-radius: 999px;
            font-size: 11px; font-weight: 600; margin-left: 4px;
        }
        .matched-tag   { background: #d1fae5; color: var(--c-success-deep); }
        .unmatched-tag { background: #fee2e2; color: var(--c-danger-deep); }

        /* 提交出库条(JS 会设 className = 'commit-bar ready' | 'commit-bar notready') */
        .commit-bar {
            display: flex; align-items: center; gap: 14px;
            margin-top: 12px; padding: 12px 14px;
            border-radius: var(--r-lg);
            border: 1px solid var(--c-border-soft);
        }
        .commit-bar.notready { background: var(--c-bg-soft); }
        .commit-bar.ready {
            background: #f0fdf4; border-color: #bbf7d0;
            box-shadow: 0 0 0 1px rgba(16,185,129,.08);
        }
        #commitHint { flex: 1; font-size: 13.5px; color: var(--c-text-2); }
        .commit-bar.ready #commitHint { color: var(--c-success-deep); font-weight: 600; }
        .commit-btn {
            padding: 10px 24px; font-size: 15px; font-weight: 600;
            background: var(--c-success); color: #fff;
            border: none; border-radius: var(--r-md);
            cursor: pointer; transition: all .18s;
            white-space: nowrap;
        }
        .commit-btn:hover:not(:disabled) { background: #059669; box-shadow: 0 4px 10px rgba(16,185,129,.25); }
        .commit-btn:disabled { background: var(--c-text-3); color: #fff; opacity: .55; cursor: not-allowed; }

        /* 结果弹窗 */
        .modal-mask {
            position: fixed; inset: 0; background: rgba(15,23,42,.5);
            display: none; align-items: center; justify-content: center;
            z-index: 200; padding: 20px;
            animation: mask-in .2s;
        }
        @keyframes mask-in { from { opacity: 0; } to { opacity: 1; } }
        .modal-mask.show { display: flex; }
        .modal-box {
            background: var(--c-bg-elev);
            border-radius: var(--r-lg);
            border: 1px solid var(--c-border-soft);
            box-shadow: var(--sh-lg);
            padding: 24px;
            max-width: 460px; width: 100%;
            text-align: center;
            animation: modal-in .22s;
        }
        @keyframes modal-in { from { transform: translateY(-12px) scale(.98); opacity: 0; } to { transform: none; opacity: 1; } }
        .modal-box h3 { font-size: 18px; margin-bottom: 12px; color: var(--c-text); }
        .modal-box .ok  { color: var(--c-success-deep); font-weight: 600; font-size: 15px; white-space: pre-line; }
        .modal-box .err { color: var(--c-danger-deep);  font-weight: 600; font-size: 15px; white-space: pre-line; }
        .modal-box pre {
            background: var(--c-bg); padding: 10px; border-radius: var(--r-md);
            font-size: 12px; text-align: left; max-height: 200px; overflow: auto;
            margin: 12px 0; border: 1px solid var(--c-border-soft);
        }
        .modal-box .actions { margin-top: 18px; }

        /* 响应式 */
        @media (max-width: 720px) {
            .app-header { flex-wrap: wrap; height: auto; padding: 10px 16px; gap: 8px; }
            .brand .subtitle { display: none; }
            .view { padding: 16px; }
            .scan-row { grid-template-columns: 1fr; gap: 4px; }
        }
        @media (prefers-reduced-motion: reduce) {
            * { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>

<!-- ===== 登录屏(整屏渐变,登录成功后 JS 隐藏) ===== -->
<div id="loginView" class="login-view">
    <div class="login-card">
        <div class="logo-icon">📦</div>
        <h1>SimpleWMS</h1>
        <p class="subtitle" data-i18n="login.subtitle">UHF RFID 出库扫码终端 · 登录 WMS 后台</p>
        <div class="field">
            <label for="loginWmsUrl" data-i18n="login.wmsUrl">WMS 地址(独立部署才填)</label>
            <input id="loginWmsUrl" data-i18n-placeholder="login.wmsUrl.ph" placeholder="http://192.168.1.100:9080 等" />
        </div>
        <div class="field">
            <label for="loginUser" data-i18n="login.username">账号</label>
            <input id="loginUser" data-i18n-placeholder="login.username.ph" placeholder="WMS 用户名"
                   autocomplete="username"
                   onkeydown="if(event.key==='Enter'){doLogin();event.preventDefault();}" />
        </div>
        <div class="field">
            <label for="loginPass" data-i18n="login.password">密码</label>
            <input id="loginPass" type="password" data-i18n-placeholder="login.password.ph" placeholder="WMS 密码"
                   autocomplete="current-password"
                   onkeydown="if(event.key==='Enter'){doLogin();event.preventDefault();}" />
        </div>
        <button class="btn btn-primary" data-i18n="login.submit" onclick="doLogin()">登 录</button>
        <div class="login-err" id="loginError"></div>
        <div class="hint" data-i18n-html="login.hint"></div>
        <div class="lang-row">
            <div class="lang-switch">
                <button type="button" data-lang="zh-CN">中文</button>
                <button type="button" data-lang="en-US">English</button>
            </div>
        </div>
    </div>
</div>

<!-- ===== 顶部 Header(与 WMS 主界面一致) ===== -->
<header class="app-header">
    <div class="brand">
        <span class="logo">📦</span>
        <span class="title">SimpleWMS</span>

const I18N = {
    // 与 WMS 用同一键 'wms.lang';但 localStorage 按 origin 隔离,
    // 5001(本终端)与 9080(WMS 的 nginx 入口)各自独立记忆,不会真正跨应用共享。
    key: 'wms.lang',
    currentLang: 'zh-CN',
    t(key, params) {
        const entry = I18N_DICT[key];
        let str = entry ? (entry[this.currentLang] || entry['zh-CN'] || key) : key;
        if (params && typeof str === 'string') {
            str = str.replace(/\{(\w+)\}/g, (m, k) => (params[k] != null ? params[k] : m));
        }
        return str;
    },
    applyI18n(root) {
        root = root || document;
        root.querySelectorAll('[data-i18n]').forEach(el => {
            const k = el.getAttribute('data-i18n');
            el.textContent = this.t(k);
        });
        root.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
            el.setAttribute('placeholder', this.t(el.getAttribute('data-i18n-placeholder')));
        });
        root.querySelectorAll('[data-i18n-html]').forEach(el => {
            el.innerHTML = this.t(el.getAttribute('data-i18n-html'));
        });
    },
    setLang(lang) {
        if (lang !== 'zh-CN' && lang !== 'en-US') lang = 'zh-CN';
        this.currentLang = lang;
        try { localStorage.setItem(this.key, lang); } catch (e) {}
        document.documentElement.setAttribute('lang', lang);
        document.querySelectorAll('.lang-switch button').forEach(b => {
            b.classList.toggle('active', b.dataset.lang === lang);
        });
        this.applyI18n(document);
        refreshTexts();  // 重刷 JS 动态文案
    },
    init() {
        let stored = null;
        try { stored = localStorage.getItem(this.key); } catch (e) {}
        const nav = (navigator.language || 'zh-CN').toLowerCase();
        this.currentLang = (stored && (stored === 'en-US' || stored === 'zh-CN')) ? stored : (nav.startsWith('en') ? 'en-US' : 'zh-CN');
        document.documentElement.setAttribute('lang', this.currentLang);
        document.querySelectorAll('.lang-switch button').forEach(b => {
            b.classList.toggle('active', b.dataset.lang === this.currentLang);
        });
        this.applyI18n(document);
    }
};
function t(key, params) { return I18N.t(key, params); }

/* 语言切换点击(委托,登录页与顶栏共用) */
document.addEventListener('click', (e) => {
    const b = e.target.closest('.lang-switch button[data-lang]');
    if (b) { I18N.setLang(b.dataset.lang); }
});

/* ============================================================
   业务状态
   ============================================================ */
let selectedOrderId = null;
let selectedOrderNo = null;
let scanResults = [];   // [{epc, sku, matched, reason, ts}]
let expectedEpcs = [];  // [{code, sku, productName, ...}] 当前单锁定的 EPC 列表
let _wmsBase = '';      // WMS 入口地址(nginx),如 "http://192.168.1.100:9080"
let _currentUser = null; // 当前登录的 WMS 用户
let _dispatchAutoSelectArmed = false; // 首次自动认领只做一次
let _bootstrapped = false;            // onLoginSuccess 幂等,防重复轮询
let _sessionPromise = null;
// 服务端记录的「本单已命中 EPC」全量集合。读卡器是循环读卡的,活动流水
// (d.scanned,只有最近 30 条)会被未匹配标签刷屏,若用它算 ✓ 会把已确认的
// 记录挤出去、进度看起来被"重置";所以进度一律以这个全量集合为准。
let serverMatched = [];

// 已确认命中的 EPC 集合 = 服务端全量 ∪ 本地刚扫到的
function confirmedEpcs() {
    const s = new Set(serverMatched.map(x => x._epc || x.epc));
    for (const r of scanResults) if (r.matched) s.add(r._epc || r.epc);
    return s;
}

// 建立本地会话 cookie(CSRF 防护用),登录/轮询前先调用一次。
// force=true 时丢弃缓存强制重建(服务重启后旧 cookie 会失效)。
function ensureSession(force) {
    if (force) _sessionPromise = null;
    if (!_sessionPromise) {
        _sessionPromise = fetch('/api/wms/session').then(r => r.json()).catch(() => ({}));
    }
    return _sessionPromise;
}

// 所有 /api/wms/* 、/command/* 都走这里:
//   服务端会话 token 是进程级的,容器重启/发版后会重新生成,浏览器旧 cookie
//   随即失效 → 全部接口 403。旧版本页面表现就是"读卡器未连"+点开始扫码弹
//   "启动失败: undefined"。这里遇到 403 自动重建会话并重试一次(403 是在
//   会话校验阶段被拒,handler 还没执行,重试是安全的)。
async function apiFetch(url, opts) {
    await ensureSession(false);
    let res = await fetch(url, opts);
    if (res.status === 403) {
        await ensureSession(true);
        res = await fetch(url, opts);
    }
    return res;
}

// HTML 转义:所有插入 innerHTML 的服务端/用户字符串先过这里(防注入)
function esc(v) {
    return String(v == null ? '' : v)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// ====== 启动(应用已保存语言 / 预填账号 / 尝试静默登录) ======
async function init() {
    await ensureSession();   // 先建会话,后续 /api/wms/* 才有 cookie
    I18N.init();
    const savedUrl = localStorage.getItem('wms_base_url') || '';
    document.getElementById('loginWmsUrl').value = savedUrl;
    if (!savedUrl) {
        // 猜的是 WMS 的 **nginx 入口(9080)**,不是后端直连端口(9090)——
        // 后端那个端口只绑本机回环,局域网里只有 9080 这道门,/api/* 由 nginx 反代。
        const guess = location.protocol + '//' + location.hostname + ':9080';
        document.getElementById('loginWmsUrl').placeholder = guess;
    }
    const lastUser = localStorage.getItem('wms_last_user') || '';
    document.getElementById('loginUser').value = lastUser;

    if (savedUrl && lastUser) {
        apiFetch('/api/wms/state').then(r => r.json()).then(st => {
            if (st.data && st.data.loggedIn) {
                _wmsBase = savedUrl.replace(/\/+$/, '');
                _currentUser = st.data.user || lastUser;
                onLoginSuccess(_currentUser, st.data.role || '');
            }
        }).catch(() => {});
    }
}

// ====== 登录(走 bridge 代理避开 CORS) ======
async function doLogin() {
    await ensureSession();
    const wms = (document.getElementById('loginWmsUrl').value || '').trim();
    const user = (document.getElementById('loginUser').value || '').trim();
    const pass = document.getElementById('loginPass').value || '';
    const errEl = document.getElementById('loginError');
    if (errEl) errEl.textContent = '';
    if (!user || !pass) { if (errEl) errEl.textContent = t('login.empty'); return; }
    try {
        const r = await apiFetch('/api/wms/login?wms=' + encodeURIComponent(wms), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: user, password: pass })
        });
        const j = await r.json();
        if (j.code === 0) {
            localStorage.setItem('wms_base_url', wms);
            localStorage.setItem('wms_last_user', user);
            _wmsBase = wms.replace(/\/+$/, '');
            _currentUser = user;
            onLoginSuccess(user, j.data.role || '');
        } else {
            if (errEl) errEl.textContent = t('login.fail', { msg: j.message || '' });
        }
    } catch (e) {
        if (errEl) errEl.textContent = t('login.netErr', { msg: e.message });
    }
}

function onLoginSuccess(username, role) {
    if (_bootstrapped) return;   // 幂等:init() 静默登录与手动登录竞态时只走一次
    _bootstrapped = true;
    document.getElementById('loginView').style.display = 'none';
    document.getElementById('mainView').style.display = '';
    document.getElementById('wmsBadge').className = 'badge online';
    document.getElementById('wmsBadge').textContent = t('wms.logged');
    document.getElementById('userInfo').textContent = '👤 ' + username + (role ? ' (' + role + ')' : '');
    document.getElementById('userInfo').style.display = '';
    document.getElementById('hdrLang').style.display = '';
    document.getElementById('btnLogout').style.display = '';
    refreshBadges();
    loadOrders();
    pollScanResults();
    setInterval(refreshBadges, 3000);
    setInterval(pollScanResults, 1500);
}

async function logout() {
    if (!confirm(t('logout.confirm'))) return;
    // 1) 让 bridge 丢弃 WMS token / 作业状态
    try { await apiFetch('/api/wms/logout', { method: 'POST' }); } catch (e) {}
    // 2) 清除本地记住的凭据,init() 不再静默重登
    try { localStorage.removeItem('wms_base_url'); } catch (e) {}
    try { localStorage.removeItem('wms_last_user'); } catch (e) {}
    location.reload();
}

// 把设备的真实 reading 状态同步到按钮。
// 不做同步的话,页面只在"自己" start/stop 成功时改按钮:一旦设备状态在别处
// 改变(另一客户端、容器重启、我手动调 stop_read),页面就会停在错误态 ——
// 典型表现是「开始扫码」被置灰,点了没反应,日志里也看不到任何请求。
function syncReadButtons(reading) {
    const s = document.getElementById('btnStart');
    const t2 = document.getElementById('btnStop');
    if (!s || !t2) return;
    const on = !!reading;
    s.disabled = on;
    t2.disabled = !on;
}

async function refreshBadges() {
    try {
        const r = await apiFetch('/api/wms/reader-info').then(r => r.json());
        const d = r.data || {};
        const rb = document.getElementById('readerBadge');
        // 连接状态 + 读卡状态一起显示(用户反馈:看不到读卡器是否在"读")
        rb.textContent = d.connected
            ? t('reader.conn') + ' · ' + (d.reading ? t('reader.reading') : t('reader.idle'))
            : t('reader.disc');
        rb.className = 'badge ' + (d.connected ? 'online' : 'offline');
        document.getElementById('readerInfo').textContent = d.host + ':' + d.port;
        syncReadButtons(d.reading);

        const ws = await apiFetch('/api/wms/state').then(r => r.json());
        const wb = document.getElementById('wmsBadge');
        wb.textContent = ws.data && ws.data.loggedIn ? t('wms.logged') : t('wms.not');
        wb.className = 'badge ' + (ws.data && ws.data.loggedIn ? 'online' : 'offline');
    } catch (e) { /* ignore */ }
}

function renderSelectedInfo() {
    const el = document.getElementById('selectedInfo');
    if (!selectedOrderId) { el.textContent = t('main.noOrder'); return; }
    el.innerHTML = '';
    el.appendChild(document.createTextNode(t('main.currentOrder') + ' '));
    const b = document.createElement('b');
    b.textContent = selectedOrderNo || '';
    el.appendChild(b);
}

function setStatText() {
    const ok = confirmedEpcs().size;   // 本单已命中(以服务端全量集合为准)
    const bad = scanResults.filter(s => !s.matched).length;
    document.getElementById('statInfo').textContent = t('scan.stat', { scanned: scanResults.length, ok: ok, bad: bad });
}

/* 语言切换后刷新所有 JS 生成的文案 */
function refreshTexts() {
    renderSelectedInfo();
    if (scanResults.length) {
        renderScan();
    } else {
        document.getElementById('scanList').innerHTML =
            '<div class="empty">' + t(selectedOrderId ? 'scanList.selectHint' : 'scanList.emptyStart') + '</div>';
        if (selectedOrderId) renderExpectedList(); // 无扫码记录时也要刷新期望计数 + 提交条文案(切语言用)
    }
    setStatText();
    refreshBadges();
}

async function loadOrders() {
    const kw = document.getElementById('kw').value || '';
    const r = await apiFetch('/api/wms/draft-orders?keyword=' + encodeURIComponent(kw)).then(r => r.json());
    const orders = (r.data || []);
    const box = document.getElementById('orders');
    if (!orders.length) { box.innerHTML = '<div class="empty">' + t('orders.empty') + '</div>'; return; }
    box.innerHTML = orders.map(o => `
        <div class="order-row ${o.id === selectedOrderId ? 'selected' : ''}" data-id="${o.id}" data-no="${esc(o.orderNo)}" role="button" tabindex="0">
            <div>
                <span class="no">${esc(o.orderNo)}</span>
                <span class="customer">${esc(o.customer || '-')}</span>
            </div>
            <div class="qty">${t('orders.qty', { rows: o.itemCount || 0, qty: o.totalQuantity || 0 })}</div>
        </div>
    `).join('');
}

async function selectOrder(id, no) {
    selectedOrderId = id;
    selectedOrderNo = no;
    scanResults = [];
    serverMatched = [];
    renderSelectedInfo();
    document.getElementById('scanList').innerHTML = '<div class="empty">' + t('scanList.selectHint') + '</div>';
    document.querySelectorAll('.order-row').forEach(r => {
        r.classList.toggle('selected', parseInt(r.dataset.id) === id);
    });
    await apiFetch('/api/wms/select-order', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({orderId: id})
    });
    await loadExpectedEpcs();
    await pollScanResults();
}

// ===== 加载并渲染"期望扫码"列表(本单锁定的所有 EPC,走 bridge 避开 CORS) =====
async function loadExpectedEpcs() {
    if (!selectedOrderId) return;
    try {
        const r = await apiFetch('/api/wms/orders/' + selectedOrderId + '/expect').then(r => r.json());
        expectedEpcs = (r.code === 0) ? (r.data || []) : [];
        renderExpectedList();
    } catch (e) {
        expectedEpcs = [];
        renderExpectedList();
    }
}

function renderExpectedList() {
    const panel = document.getElementById('expectedPanel');
    const list = document.getElementById('expectedList');
    const totalEl = document.getElementById('expectedTotal');
    const scannedEl = document.getElementById('expectedScanned');
    if (!expectedEpcs.length) { panel.style.display = 'none'; return; }
    panel.style.display = '';
    totalEl.textContent = expectedEpcs.length;
    const scannedSet = confirmedEpcs();
    scannedEl.textContent = scannedSet.size;
    list.innerHTML = expectedEpcs.map(e => {
        const code = e.code || e.epc;
        const isScanned = scannedSet.has(code);
        return `
        <div class="epc-item ${isScanned ? 'scanned' : ''}">
            <span class="check">${isScanned ? '✓' : '·'}</span>
            <span>${esc(code)} <span class="sku">${esc(e.sku || '')}</span></span>
            <span></span>
        </div>`;
    }).join('');
    updateCommitButton();
}

function updateCommitButton() {
    const bar = document.getElementById('commitBar');
    const btn = document.getElementById('btnCommit');
    const hint = document.getElementById('commitHint');
    const total = expectedEpcs.length;
    const scanned = confirmedEpcs().size;
    if (total === 0) { bar.style.display = 'none'; return; }
    bar.style.display = '';
    const left = total - scanned;
    if (left <= 0) {
        bar.className = 'commit-bar ready';
        hint.textContent = t('commit.hintAll', { n: total });
        btn.disabled = false;
    } else {
        bar.className = 'commit-bar notready';
        hint.textContent = t('commit.hintLeft', { n: left });
        btn.disabled = true;
    }
}

function renderScan() {
    const list = [...scanResults].reverse();
    const box = document.getElementById('scanList');
    if (!list.length) { box.innerHTML = '<div class="empty">' + t('scanList.empty0') + '</div>'; return; }
    box.innerHTML = list.map(s => `
        <div class="scan-row ${s.matched ? 'matched' : 'unmatched'}">
            <div>
                <div class="epc">${esc(s._epc || s.epc || '?')}</div>
                <div class="time">${esc(s._ts || '')}</div>
            </div>
            <div>
                ${s.matched
                    ? '<div class="sku">' + esc(s.sku || '-') + ' <span class="matched-tag">' + t('tag.matched') + '</span></div><div class="info-line">' + t('scan.acc', { n: s.scannedQty || 0 }) + '</div>'
                    : '<div class="sku">— <span class="unmatched-tag">' + t('tag.unmatched') + '</span></div><div class="reason">' + esc(s.reason || '?') + '</div>'}
            </div>
            <div></div>
        </div>
    `).join('');
    renderExpectedList();
}

// 接收扫码实时事件 — 通过 /api/wms/state 轮询拉取(每 1.5s)
function pollScanResults() {
    return apiFetch('/api/wms/state').then(r => r.json()).then(r => {
        const d = (r.data || {});
        const newScanned = d.scanned || [];
        // 服务端"本单已命中"全量集合:进度以此为准,不受 30 条流水窗口影响
        serverMatched = d.matched || [];
        if (newScanned.length !== scanResults.length ||
            (newScanned.length && newScanned[newScanned.length-1]._epc !== (scanResults[scanResults.length-1]||{})._epc)) {
            const oldEpcs = new Set(scanResults.map(s => s._epc));
            for (const s of newScanned) {
                if (!oldEpcs.has(s._epc)) {
                    try { s.matched ? beepSuccess() : beepFail(); } catch (e) {}
                }
            }
            scanResults = newScanned;
            renderScan();
            setStatText();
        } else {
            // 流水窗口没变,但命中集合可能已增长 → 仍需刷新期望列表/提交条
            renderExpectedList();
        }
        if (!selectedOrderId && d.loggedIn && !_dispatchAutoSelectArmed) {
            _dispatchAutoSelectArmed = true;
            autoClaimFirstDispatch();
        }
    }).catch(() => {});
}

async function autoClaimFirstDispatch() {
    const r = await apiFetch('/api/wms/draft-orders').then(r => r.json()).catch(() => ({}));
    const orders = r.data || [];
    if (orders.length) {
        const o = orders[0];
        await selectOrder(o.id, o.orderNo);
    }
}

async function startRead() {
    if (!selectedOrderId) { alert(t('start.noOrder')); return; }
    const r = await apiFetch('/command/start_read', {method: 'POST'});
    const d = await r.json();
    if (d.success) {
        syncReadButtons(true);
    } else {
        // d.error 是读卡器返回的原始错误;会话类失败只有 message,别弹 undefined
        alert(t('start.fail', { msg: d.error || d.message || ('HTTP ' + r.status) }));
        // 失败时按设备真实状态回正按钮
        try { const s = await apiFetch('/api/wms/reader-info').then(x => x.json()); syncReadButtons((s.data || {}).reading); } catch (e) {}
    }
}
async function stopRead() {
    const r = await apiFetch('/command/stop_read', {method: 'POST'});
    const d = await r.json();
    if (d.success) {
        syncReadButtons(false);
    }
}
async function clearScanned() {
    // 先清服务端 scanned_cache,再清本地:避免轮询把刚清掉的记录又带回来
    try { await apiFetch('/api/wms/scan-clear', { method: 'POST' }); } catch (e) {}
    scanResults = [];
    serverMatched = [];
    renderScan();
    setStatText();
}

// ===== 声音告警(共享 AudioContext,避免反复创建) =====
let _audioCtx = null;
function _ensureCtx() {
    if (!_audioCtx) {
        try { _audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        catch (e) { return null; }
    }
    if (_audioCtx.state === 'suspended') _audioCtx.resume();
    return _audioCtx;
}
function beep(freq, dur, type) {
    const ctx = _ensureCtx();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.value = 0.18;
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start();
    setTimeout(() => { try { osc.stop(); } catch (e) {} }, dur);
}
function beepSuccess() { beep(800, 100, 'sine'); }
function beepFail() {
    beep(1200, 150, 'square');
    setTimeout(() => beep(1200, 150, 'square'), 200);
    setTimeout(() => beep(1200, 150, 'square'), 400);
    setTimeout(() => beep(1200, 400, 'square'), 600);
}

// ===== 手动扫码(无读卡器时也能演示,走 bridge 避开 CORS) =====
async function manualScan() {
    if (!selectedOrderId) { alert(t('manual.noOrder')); return; }
    const input = document.getElementById('manualEpc');
    const epc = (input.value || '').trim().toUpperCase();
    if (!epc) { alert(t('manual.needEpc')); return; }
    if (epc.length !== 24) { beepFail(); alert(t('manual.badLen', { n: epc.length })); return; }
    const r = await apiFetch('/api/wms/scan', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ epc: epc, orderId: selectedOrderId })
    }).then(r => r.json());
    if (r.code === 0 && r.data) {
        const sr = Object.assign({}, r.data, { _epc: epc, _ts: new Date().toLocaleTimeString() });
        scanResults.push(sr);
        if (scanResults.length > 100) scanResults.shift();
        renderScan();
        setStatText();
        if (sr.matched) { beepSuccess(); input.value = ''; }
        else { beepFail(); }
    } else {
        beepFail();
        alert(t('manual.fail', { msg: r.message || 'unknown' }));
    }
}

// ===== 提交出库(全部扫完才允许,走 bridge 避开 CORS) =====
async function doCommit() {
    if (!selectedOrderId) { alert(t('start.noOrder')); return; }
    if (!confirm(t('commit.confirm', { no: selectedOrderNo }))) return;
    const btn = document.getElementById('btnCommit');
    btn.disabled = true;
    btn.textContent = t('commit.busy');
    try {
        const r = await apiFetch('/api/wms/orders/' + selectedOrderId + '/commit', {
            method: 'POST'
        }).then(r => r.json());
        if (r.code === 0) {
            showResult(true, t('result.titleOk'), t('result.bodyOk', { no: selectedOrderNo, qty: (r.data.totalQuantity || 0) }));
            // 通知 bridge 反选:清掉该单的 scanned_cache/期望,派单轮询才能认领下一单,
            // 否则轮询会把已提交单的扫码记录重新导回界面并逐条响铃。
            try {
                await apiFetch('/api/wms/select-order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ orderId: null })
                });
            } catch (e) {}
            selectedOrderId = null;
            selectedOrderNo = null;
            scanResults = [];
            serverMatched = [];
            expectedEpcs = [];
            document.getElementById('expectedPanel').style.display = 'none';
            document.getElementById('commitBar').style.display = 'none';
            renderSelectedInfo();
            loadOrders();
        } else {
            showResult(false, t('result.titleFail'), r.message || '');
        }
    } catch (e) {
        showResult(false, t('result.titleFail'), t('result.netErr', { msg: e.message }));
    } finally {
        btn.textContent = t('commit.btn');
        btn.disabled = false;
    }
}

function showResult(ok, title, body) {
    document.getElementById('resultTitle').textContent = title;
    const b = document.getElementById('resultBody');
    b.className = ok ? 'ok' : 'err';
    b.textContent = body;
    document.getElementById('resultDetail').style.display = 'none';
    document.getElementById('resultModal').classList.add('show');
}
function closeResultModal() {
    document.getElementById('resultModal').classList.remove('show');
}

// 出库单行点击(事件委托,代替内联 onclick,避免 orderNo 拼进代码造成注入)
document.getElementById('orders').addEventListener('click', (e) => {
    const row = e.target.closest('.order-row');
    if (!row) return;
    const id = parseInt(row.dataset.id, 10);
    if (id) selectOrder(id, row.dataset.no || '');
});

// ====== 启动 ======
init();
</script>
