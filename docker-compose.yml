# =====================================================
#  SimpleWMS  -  docker-compose
#  项目名 (container 前缀): simplewms
#  服务: mysql + backend + frontend
#
#  首次启动:
#    1) cp .env.example .env  (修改里面的密码与 JWT_SECRET)
#    2) openssl rand -base64 48  填到 .env 的 JWT_SECRET
#    3) docker compose --env-file .env up -d --build
#
#  日常启停:
#    docker compose --env-file .env up -d     (启动)
#    docker compose down                      (停止,数据保留)
#    docker compose down -v                   (停止 + 删数据,慎用 ——
#                                              改 MYSQL_PASSWORD 后必须走这条)
#
#  ⚠️  改 MYSQL_PASSWORD / MYSQL_USER 后:
#    MySQL 镜像只在 data dir 为空(首次启动)时用 env 创建/重置用户,
#    已存在的 mysql-data volume 不会更新。需 docker compose down -v 重置。
#
#  注: 不传 --env-file 时,容器会用 .env.example 里的默认 demo 值,
#       仅适合本地开发,生产前必须改。
# =====================================================

name: simplewms

services:

  # ---------- 1. MySQL ----------
  mysql:
    image: mysql:8.0
    container_name: simplewms-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # 密码从 .env 读(没 .env 时用 demo 默认值,生产务必覆盖)
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: simple_wms
      MYSQL_USER: ${MYSQL_USER:-wms}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wmspass}
      # 让 utf8mb4 默认生效
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      # 容器 3306 -> 宿主机 23306(对外,局域网可用 Navicat/DBeaver 直连)
      # 用 23306 而非 3306:Windows 上 3306 常被 Hyper-V 预留,绑不上。
      # 后端容器仍走 docker 网络服务名 mysql:3306,不受影响。
      # ⚠️ 数据库暴露到局域网,请确保 MYSQL_ROOT_PASSWORD / MYSQL_PASSWORD
      #    是强口令;只本机调试可改为 "127.0.0.1:23306:3306"。
      - "23306:3306"
    volumes:
      # 数据持久化(删容器数据不丢)
      - mysql-data:/var/lib/mysql
      # 首次启动自动建库 + 建表
      - ./sql/mysql-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=caching_sha2_password
      # 关键:每个 client 连接时自动 SET NAMES utf8mb4,否则 docker MySQL 镜像默认
      # character_set_client=latin1,导致中文 INSERT/SELECT 出现 mojibake
      - --init-connect=SET NAMES utf8mb4
    healthcheck:
      # 重要:硬编码 -prootpass 会让改了 MYSQL_ROOT_PASSWORD 的部署永远 unhealthy,
      # backend (depends_on: service_healthy) 起不来首启即死锁。改用 sh -c 从 env 拼命令。
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - simplewms-net

  # ---------- 2. Backend (Spring Boot) ----------
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    image: simplewms-backend:1.0.0
    container_name: simplewms-backend
    # 失败最多重启 5 次,避免密码错时无限重启吃资源
    restart: on-failure:5
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      # 关键:切到 mysql profile,DB host 用 docker 服务名
      SPRING_PROFILES_ACTIVE: mysql
      # 连接信息从 .env 读(没 .env 时用默认 demo 值,方便开发)
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://mysql:3306/simple_wms?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-wms}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-wmspass}
      SPRING_SQL_INIT_MODE: always
      SPRING_SQL_INIT_CONTINUE_ON_ERROR: true
      # JVM 调优
      JAVA_OPTS: "-Xms256m -Xmx512m"
      # 用户与角色 bootstrap(生产前改成 .env 注入,别用默认值)
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-now}
      # JWT 密钥强制从 .env 读,空值会拒启动
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env (32+ bytes)}
      JWT_TTL_HOURS: ${JWT_TTL_HOURS:-24}
    ports:
      # PDA 局域网需要访问,绑定所有网卡(原 127.0.0.1 仅本机)
      # 原 8080 被 Windows Hyper-V 预留,改 9090
      - "9090:8080"
    networks:
      - simplewms-net

  # ---------- 3. Frontend (nginx 反向代理) ----------
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    image: simplewms-frontend:1.0.0
    container_name: simplewms-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # 用户访问入口(原 8081:80,但 8081 也落在 Hyper-V 预留 8033-8132 内,改 9080)。
      # 与 backend / uhf-rader 一样只绑本机回环,TLS 留给前置反代。
      # 需要对外暴露时改为 "9080:80" 并部署 nginx/Traefik/Caddy。
      - "9080:80"
    networks:
      - simplewms-net

  # ---------- 4. UHF RFID 读卡器适配器 ----------
  #   - 复用 UHF-Rader/ 目录下的 Flask + TCP 客户端
  #   - 内置 wms_bridge.py:从 WMS 后端拉出库单期望清单 + 推扫码结果
  #   - Web UI:http://127.0.0.1:5001  (避免和 WMS frontend:9080 冲突,绑本机)
  uhf-rader:
    build:
      context: ./UHF-Rader
      dockerfile: Dockerfile
    image: simplewms-uhf-rader:1.0.0
    container_name: simplewms-uhf-rader
    restart: on-failure:5
    depends_on:
      - backend
    environment:
      TZ: Asia/Shanghai
      # WMS 后端地址(容器网络服务名)
      WMS_BASE_URL: http://backend:8080
      # 登录 WMS 的账号(必须与 .env 里的 ADMIN_USERNAME/ADMIN_PASSWORD 一致);
      # 不再给弱默认,缺 WMS_PASSWORD 时 bridge 启动会直接失败提示设置。
      WMS_USERNAME: ${WMS_USERNAME:?WMS_USERNAME must be set in .env}
      WMS_PASSWORD: ${WMS_PASSWORD:?WMS_PASSWORD must be set in .env}
      # 读卡器 TCP(根据现场实际改)
      READER_HOST: ${UHF_READER_HOST:-192.168.1.209}
      READER_PORT: ${UHF_READER_PORT:-5000}
      # 设备号(UHF-Rader 通过此标识 WMS 系统中的设备)
      DEFAULT_DEVICE_CODE: ${UHF_DEVICE_CODE:-MOCK-UHF-001}
    ports:
      # Web UI 本机访问
      - "5001:5000"
    networks:
      - simplewms-net

# ---------- 卷 & 网络 ----------
volumes:
  mysql-data:
    name: simplewms-mysql-data

networks:
  simplewms-net:
    name: simplewms-net
    driver: bridge