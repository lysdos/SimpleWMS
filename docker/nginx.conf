# =====================================================
#  SimpleWMS Frontend - nginx 配置
#  - 静态文件直接由 nginx 服务
#  - /api/* 反向代理到 backend
# =====================================================

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    # ---------- 安全/性能 ----------
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout  65;
    gzip              on;
    gzip_min_length   1k;
    gzip_comp_level   6;
    gzip_types        text/plain
                      text/css
                      application/javascript
                      application/json
                      image/svg+xml
                      font/ttf
                      font/otf
                      application/xml;

    # ---------- 静态文件 ----------
    root  /usr/share/nginx/html;
    index  index.html;

    # 静态资源禁缓存(方便发版后立即生效,避免浏览器加载旧版)
    location ~* \.(html|js|css|png|jpg|jpeg|gif|ico|svg)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires -1;
        try_files $uri =404;
    }
    location /css/    { try_files $uri =404; }
    location /js/     { try_files $uri =404; }
    location /assets/ { try_files $uri =404; }

    # 首页 + SPA fallback(同样禁缓存)
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    # ---------- 反向代理: REST API ----------
    # ^~ 修饰符:即使后面有正则 location 匹配,也优先使用这个前缀 location。
    # 否则像 /api/inventory/items/1/barcode.png 会被
    # location ~* \.(png)$ 抢走,导致 try_files 404。
    location ^~ /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ---------- H2 控制台(可选) ----------
    location /h2-console/ {
        proxy_pass         http://backend:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ---------- 错误页 ----------
    error_page  502 503 504  /50x.html;
    location = /50x.html {
        default_type text/html;
        return 503 '<!doctype html><html><head><meta charset="utf-8"><title>SimpleWMS</title></head><body style="font-family:sans-serif;text-align:center;padding:60px;color:#2c3e50;"><h2>SimpleWMS 服务暂不可用</h2><p>后端容器未就绪,请稍后重试,或查看 <code>docker compose logs backend</code></p></body></html>';
    }
}