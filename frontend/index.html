<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="app.title">SimpleWMS - 简单仓库管理系统</title>
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>

<header class="app-header">
    <div class="brand">
        <img class="logo" src="/assets/logo-icon.png" alt="SimpleWMS">
        <span class="title">SimpleWMS</span>
        <span class="subtitle" data-i18n="app.brand.subtitle">简单仓库管理系统</span>
    </div>
    <nav class="nav" id="nav">
        <a class="nav-item" data-route="dashboard" data-roles="ADMIN,OPERATOR" href="#/dashboard">
            <span class="nav-icon">📊</span><span data-i18n="nav.dashboard">仪表盘</span>
        </a>
        <a class="nav-item" data-route="inbound"   data-roles="ADMIN,OPERATOR" href="#/inbound">
            <span class="nav-icon">📥</span><span data-i18n="nav.inbound">入库登记</span>
        </a>
        <a class="nav-item" data-route="outbound"  data-roles="ADMIN,OPERATOR" href="#/outbound">
            <span class="nav-icon">📤</span><span data-i18n="nav.outbound">出库登记</span>
        </a>
        <a class="nav-item" data-route="orders"    data-roles="ADMIN,OPERATOR" href="#/orders">
            <span class="nav-icon">📋</span><span data-i18n="nav.orders">出入库单</span>
        </a>
        <a class="nav-item" data-route="inventory" data-roles="ADMIN,OPERATOR" href="#/inventory">
            <span class="nav-icon">📦</span><span data-i18n="nav.inventory">库存管理</span>
        </a>
        <a class="nav-item" data-route="stock-checks" data-roles="ADMIN,OPERATOR" href="#/stock-checks">
            <span class="nav-icon">🔍</span><span data-i18n="nav.stock_checks">库存盘点</span>
        </a>

        <!-- 基础管理(下拉) -->
        <div class="nav-group" data-roles="ADMIN">
            <a class="nav-item nav-parent" href="javascript:void(0)" id="nav-basic">
                <span class="nav-icon">⚙</span><span data-i18n="nav.basic">基础管理</span>
                <span class="caret">▾</span>
            </a>
            <div class="nav-dropdown" id="nav-basic-dropdown">
                <a class="nav-item" data-route="products"  data-roles="ADMIN" href="#/products">
                    <span class="nav-icon">🏷</span><span data-i18n="nav.products">商品管理</span>
                </a>
                <a class="nav-item" data-route="suppliers" data-roles="ADMIN" href="#/suppliers">
                    <span class="nav-icon">🤝</span><span data-i18n="nav.suppliers">供应商管理</span>
                </a>
                <a class="nav-item" data-route="warehouses" data-roles="ADMIN" href="#/warehouses">
                    <span class="nav-icon">🏢</span><span data-i18n="nav.warehouses">仓库管理</span>
                </a>
                <a class="nav-item" data-route="locations" data-roles="ADMIN" href="#/locations">
                    <span class="nav-icon">🗂</span><span data-i18n="nav.locations">库位管理</span>
                </a>
                <a class="nav-item" data-route="users"     data-roles="ADMIN" href="#/users">
                    <span class="nav-icon">👥</span><span data-i18n="nav.users">用户管理</span>
                </a>
            </div>
        </div>
    </nav>
    <div class="user-area">
        <div class="lang-switch" id="lang-switch" data-i18n-title="app.lang.toggle" title="语言">
            <button type="button" data-lang="zh-CN">中文</button>
            <button type="button" data-lang="en-US">EN</button>
        </div>
        <span id="me-name" class="user"></span>
        <button id="logout-btn" class="btn btn-sm" data-i18n="nav.logout" hidden>登出</button>
    </div>
</header>

<main id="view" class="view"></main>

<!-- 通用 Modal -->
<div class="modal-mask" id="modal-mask" hidden>
    <div class="modal" role="dialog" aria-modal="true">
        <div class="modal-head">
            <span id="modal-title">Title</span>
            <button class="icon-btn" onclick="closeModal()" data-i18n-title="common.close" title="关闭">×</button>
        </div>
        <div class="modal-body" id="modal-body"></div>
        <div class="modal-foot">
            <button class="btn" onclick="closeModal()" data-i18n="common.cancel">取消</button>
            <button class="btn btn-primary" id="modal-ok" data-i18n="common.ok">确定</button>
        </div>
    </div>
</div>

<!-- Toast -->
<div id="toast" class="toast" hidden></div>

<script src="/js/i18n.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/api.js"></script>
<script src="/js/views.js"></script>
<script src="/js/views/userAdmin.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
