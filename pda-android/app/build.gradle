plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wms.pda'
    compileSdk 34

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.wms.pda"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        buildConfigField "String", "API_BASE_URL", "\"http://10.0.2.2:8080\""
    }

    signingConfigs {
        release {
            storeFile file("../uhf-uart-demo/uhf-serial_release.jks")
            storePassword "123456"
            keyAlias "uhf-serial-key"
            keyPassword "123456"
        }
    }

    buildTypes {
        debug {
            // debug 用 debug 签名(系统默认)
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.squareup.okhttp3:okhttp:3.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    // 东集 iData 硬件 SDK(DeviceAPI)。UHF + 光学条码统一打在这个 aar 里。
    implementation files('libs/DeviceAPI_ver20230301_release.aar')
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.0.0'
    testImplementation 'com.squareup.okhttp3:mockwebserver:3.12.0'
    testImplementation 'org.robolectric:robolectric:4.10.3'
}
