plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wms.pda'
    compileSdk 34

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.wms.pda"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        buildConfigField "String", "API_BASE_URL", "\"http://192.168.11.160:9090\""
    }

    signingConfigs {
        release {
            storeFile file("../pda-release.jks")
            storePassword "change-me-now"
            keyAlias "pda-release"
            keyPassword "change-me-now"
        }
    }

    buildTypes {
        debug {
            // debug 用 debug 签名(系统默认)
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    testOptions {
        unitTests {
            // Robolectric 读 R.string / 布局等资源必须打开(默认 false)。
            // 关着时它在 sdk > 28 上直接以 "doesn't support legacy resources mode after P"
            // 把整个测试类 skip 掉 —— 表现为 BUILD SUCCESSFUL 但 skipped=N,极易误判为通过。
            includeAndroidResources = true
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.squareup.okhttp3:okhttp:3.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    // CameraX: PDA 摄像头扫码(预览 + 拍照)
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
    // ML Kit 条码识别(unbundled,不依赖 Google Play Services)
    implementation 'com.google.mlkit:barcode-scanning:17.2.0'
    // CHAINWAY DeviceAPI SDK(UHF RFID + 硬件条码扫把头)
    // 来源: huaxiaapp 项目(app/libs/DeviceAPI_ver20230301_release.aar)
    implementation files('libs/DeviceAPI_ver20230301_release.aar')
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.0.0'
    testImplementation 'com.squareup.okhttp3:mockwebserver:3.12.0'
    testImplementation 'org.robolectric:robolectric:4.10.3'
}
