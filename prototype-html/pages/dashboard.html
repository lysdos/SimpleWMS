<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>仪表盘 · SimpleWMS PDA</title>
    <link rel="stylesheet" href="../css/app.css">
</head>
<body>
<div class="pda">
    <div class="pda-screen">
        <div class="status-bar">
            <span>09:12</span>
            <span class="right"><span>📶</span><span>🔋 86%</span></span>
        </div>

        <div class="appbar">
            <div class="title">SimpleWMS PDA</div>
            <button class="icon-btn" onclick="App.go('settings.html')">⚙</button>
            <button class="icon-btn" onclick="App.go('login.html')">⎋</button>
        </div>

        <div class="content">
            <div class="title">您好,张三</div>
            <div class="caption mt-4">今日作业概览 · 2026-09-08</div>

            <!-- KPI 第一行 -->
            <div class="row gap-8 mt-12">
                <div class="kpi blue">
                    <div class="v">3</div>
                    <div class="l">今日入库单数</div>
                </div>
                <div class="kpi green">
                    <div class="v">2</div>
                    <div class="l">今日出库单数</div>
                </div>
            </div>
            <!-- KPI 第二行 -->
            <div class="row gap-8 mt-8">
                <div class="kpi orange">
                    <div class="v">1</div>
                    <div class="l">待盘点任务</div>
                </div>
                <div class="kpi red">
                    <div class="v">2</div>
                    <div class="l">库存预警 SKU</div>
                </div>
            </div>

            <!-- 最近操作 -->
            <div class="row between mt-16 mb-8">
                <div class="subtitle">最近操作</div>
                <span class="caption">显示 5 条</span>
            </div>

            <div class="card" style="padding:4px 8px;">
                <div class="op-log">
                    <div class="top">
                        <span class="pill">入库</span>
                        <span class="ref">RK1003</span>
                        <span class="time">11:20</span>
                    </div>
                    <div class="sum">扫描入库 2 行 4 件</div>
                </div>
                <div class="op-log">
                    <div class="top">
                        <span class="pill warn">盘点</span>
                        <span class="ref">PD3001</span>
                        <span class="time">10:55</span>
                    </div>
                    <div class="sum">生成全盘单</div>
                </div>
                <div class="op-log">
                    <div class="top">
                        <span class="pill ok">出库</span>
                        <span class="ref">CK2001</span>
                        <span class="time">10:05</span>
                    </div>
                    <div class="sum">生产线 A 领料</div>
                </div>
                <div class="op-log">
                    <div class="top">
                        <span class="pill">入库</span>
                        <span class="ref">RK1001</span>
                        <span class="time">09:12</span>
                    </div>
                    <div class="sum">创建入库单</div>
                </div>
                <div class="op-log">
                    <div class="top">
                        <span class="pill">入库</span>
                        <span class="ref">RK0993</span>
                        <span class="time">昨天 16:40</span>
                    </div>
                    <div class="sum">完成入库 80 卷标签</div>
                </div>
            </div>
        </div>

        <!-- 底部 Tab Bar -->
        <div class="tabbar">
            <div class="tab active" data-tab="dashboard" onclick="App.go('dashboard.html')">
                <div class="ico">⊞</div><div>仪表盘</div>
            </div>
            <div class="tab" data-tab="inbound" onclick="App.go('inbound-list.html')">
                <div class="ico">⤓</div><div>入库</div>
            </div>
            <div class="tab" data-tab="outbound" onclick="App.go('outbound-list.html')">
                <div class="ico">⤒</div><div>出库</div>
            </div>
            <div class="tab" data-tab="inventory" onclick="App.go('inventory.html')">
                <div class="ico">▦</div><div>库存</div>
            </div>
        </div>
    </div>
</div>
<script src="../js/app.js"></script>
<script>App.bindBottomNav('dashboard');</script>
</body>
</html>
