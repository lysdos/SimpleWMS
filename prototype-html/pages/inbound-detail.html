<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>入库单详情 · SimpleWMS PDA</title>
    <link rel="stylesheet" href="../css/app.css">
</head>
<body>
<div class="pda">
    <div class="pda-screen">
        <div class="status-bar">
            <span>09:12</span>
            <span class="right"><span>📶</span><span>🔋 86%</span></span>
        </div>

        <div class="appbar">
            <button class="icon-btn back" onclick="history.back()">‹</button>
            <div class="title">入库单详情</div>
        </div>

        <div class="content">
            <!-- 主单信息 -->
            <div class="card">
                <div class="row between">
                    <div class="title">RK1001</div>
                    <span class="pill warn">待执行</span>
                </div>
                <div class="kv mt-8"><span class="k">供应商</span><span class="v">上海某科技公司</span></div>
                <div class="kv"><span class="k">目标仓库</span><span class="v">主仓</span></div>
                <div class="kv"><span class="k">备注</span><span class="v">采购到货</span></div>
                <div class="kv"><span class="k">创建时间</span><span class="v">2026-09-08 09:12</span></div>
            </div>

            <!-- 扫码 -->
            <div class="scan-box">
                <div class="ico">▣</div>
                <div class="caption">点击下方按钮扫码,扫到的条码会自动加入入库明细。原型阶段会弹窗模拟。</div>
                <button class="btn full lg mt-12" onclick="App.showScanDialog(addInboundLine)">📷 扫码入库</button>
            </div>

            <!-- 明细 -->
            <div class="row between mt-16 mb-8">
                <div class="subtitle">入库明细</div>
                <span class="caption">共 2 行 · 已扫 3 件</span>
            </div>

            <div class="card" id="lines">
                <div class="row between">
                    <div>
                        <div class="subtitle">SKU-1001  蓝牙条码扫描枪</div>
                        <div class="caption mt-4">条码 6901234567001</div>
                    </div>
                    <div class="body" style="color:var(--primary); font-weight:700; font-size:18px;">× 2 台</div>
                </div>
                <div class="divider"></div>
                <div class="row between">
                    <div>
                        <div class="subtitle">SKU-1002  热敏标签打印机</div>
                        <div class="caption mt-4">条码 6901234567002</div>
                    </div>
                    <div class="body" style="color:var(--primary); font-weight:700; font-size:18px;">× 1 台</div>
                </div>
            </div>
        </div>

        <!-- 底部操作栏 -->
        <div style="padding:10px 12px; background:#fff; border-top:1px solid var(--divider); flex-shrink:0;">
            <button class="btn full lg" onclick="App.confirm('完成入库','确认提交此单?完成后将扣减库存。',()=>{App.toast('已完成入库 RK1001'); setTimeout(()=>history.back(),600);})">完成入库</button>
        </div>
    </div>
</div>
<script src="../js/app.js"></script>
<script>
    function addInboundLine(barcode) {
        const map = {
            '6901234567001': ['SKU-1001', '蓝牙条码扫描枪', '台'],
            '6901234567002': ['SKU-1002', '热敏标签打印机', '台'],
            '6901234567003': ['SKU-1003', '工业 PDA 终端', '台'],
            '6901234567004': ['SKU-1004', '不干胶标签 50x30', '卷'],
            '6901234567005': ['SKU-1005', '碳带 110mm x 300m', '卷'],
            '6901234567006': ['SKU-1006', '周转箱 600x400', '个'],
            '6901234567007': ['SKU-1007', '防静电手套', '双'],
        };
        const m = map[barcode] || ['?', '未知条码 ' + barcode, '件'];
        const box = document.getElementById('lines');
        const lines = box.querySelectorAll('.row');
        let exist = null;
        lines.forEach(r => {
            if (r.dataset.barcode === barcode) exist = r;
        });
        if (exist) {
            const qty = exist.querySelector('.body[style*="primary"]');
            const n = parseInt(qty.textContent.replace(/[^0-9]/g,'')) + 1;
            qty.textContent = `× ${n} ${m[2]}`;
        } else {
            const div = document.createElement('div');
            if (box.firstChild) {
                const d = document.createElement('div'); d.className = 'divider';
                box.appendChild(d);
            }
            div.dataset.barcode = barcode;
            div.className = 'row between';
            div.innerHTML = `
                <div>
                    <div class="subtitle">${m[0]}  ${m[1]}</div>
                    <div class="caption mt-4">条码 ${barcode}</div>
                </div>
                <div class="body" style="color:var(--primary); font-weight:700; font-size:18px;">× 1 ${m[2]}</div>
            `;
            box.appendChild(div);
        }
        App.toast('已加入: ' + barcode);
    }
</script>
</body>
</html>
