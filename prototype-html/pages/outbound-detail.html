<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>出库单详情 · SimpleWMS PDA</title>
    <link rel="stylesheet" href="../css/app.css">
</head>
<body>
<div class="pda">
    <div class="pda-screen">
        <div class="status-bar">
            <span>09:12</span>
            <span class="right"><span>📶</span><span>🔋 86%</span></span>
        </div>

        <div class="appbar">
            <button class="icon-btn back" onclick="history.back()">‹</button>
            <div class="title">出库单详情</div>
        </div>

        <div class="content">
            <div class="card">
                <div class="row between">
                    <div class="title">CK2001</div>
                    <span class="pill warn">待执行</span>
                </div>
                <div class="kv mt-8"><span class="k">客户/部门</span><span class="v">生产线 A</span></div>
                <div class="kv"><span class="k">出库仓库</span><span class="v">主仓</span></div>
                <div class="kv"><span class="k">备注</span><span class="v">工单领料</span></div>
                <div class="kv"><span class="k">创建时间</span><span class="v">2026-09-08 08:30</span></div>
            </div>

            <div class="scan-box">
                <div class="ico">▣</div>
                <div class="caption">扫码出库:扫到的条码会从本单累计扣减,扫描到不存在的 SKU 时会报错。</div>
                <button class="btn full lg mt-12" onclick="App.showScanDialog(addOutboundLine)">📷 扫码出库</button>
            </div>

            <div class="row between mt-16 mb-8">
                <div class="subtitle">出库明细</div>
                <span class="caption">共 2 行 · 已扫 0 件</span>
            </div>

            <div class="card" id="lines">
                <div class="row between">
                    <div>
                        <div class="subtitle">SKU-1001  蓝牙条码扫描枪</div>
                        <div class="caption mt-4">条码 6901234567001</div>
                    </div>
                    <div class="body" style="color:var(--primary); font-weight:700; font-size:18px;">× 2 台</div>
                </div>
                <div class="divider"></div>
                <div class="row between">
                    <div>
                        <div class="subtitle">SKU-1004  不干胶标签 50x30</div>
                        <div class="caption mt-4">条码 6901234567004</div>
                    </div>
                    <div class="body" style="color:var(--primary); font-weight:700; font-size:18px;">× 20 卷</div>
                </div>
            </div>
        </div>

        <div style="padding:10px 12px; background:#fff; border-top:1px solid var(--divider); flex-shrink:0;">
            <button class="btn full lg" onclick="App.confirm('完成出库','确认提交此单?完成后将从库存扣减。',()=>{App.toast('已完成出库 CK2001'); setTimeout(()=>history.back(),600);})">完成出库</button>
        </div>
    </div>
</div>
<script src="../js/app.js"></script>
<script>
    function addOutboundLine(barcode) {
        const map = {
            '6901234567001': ['SKU-1001', '蓝牙条码扫描枪', '台'],
            '6901234567002': ['SKU-1002', '热敏标签打印机', '台'],
            '6901234567003': ['SKU-1003', '工业 PDA 终端', '台'],
            '6901234567004': ['SKU-1004', '不干胶标签 50x30', '卷'],
            '6901234567005': ['SKU-1005', '碳带 110mm x 300m', '卷'],
            '6901234567006': ['SKU-1006', '周转箱 600x400', '个'],
            '6901234567007': ['SKU-1007', '防静电手套', '双'],
        };
        const m = map[barcode] || ['?', '未知条码 ' + barcode, '件'];
        const box = document.getElementById('lines');
        const lines = box.querySelectorAll('.row');
        let exist = null;
        lines.forEach(r => { if (r.dataset.barcode === barcode) exist = r; });
        if (exist) {
            const qty = exist.querySelector('.body[style*="primary"]');
            const n = parseInt(qty.textContent.replace(/[^0-9]/g,'')) + 1;
            qty.textContent = `× ${n} ${m[2]}`;
        } else {
            const div = document.createElement('div');
            const d = document.createElement('div'); d.className = 'divider';
            box.appendChild(d);
            div.dataset.barcode = barcode;
            div.className = 'row between';
            div.innerHTML = `
                <div>
                    <div class="subtitle">${m[0]}  ${m[1]}</div>
                    <div class="caption mt-4">条码 ${barcode}</div>
                </div>
                <div class="body" style="color:var(--primary); font-weight:700; font-size:18px;">× 1 ${m[2]}</div>
            `;
            box.appendChild(div);
        }
        App.toast('已出库: ' + barcode);
    }
</script>
</body>
</html>
