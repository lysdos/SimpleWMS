<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>服务器设置 · SimpleWMS PDA</title>
    <link rel="stylesheet" href="../css/app.css">
</head>
<body>
<div class="pda">
    <div class="pda-screen">
        <div class="status-bar">
            <span>09:12</span>
            <span class="right"><span>📶</span><span>🔋 86%</span></span>
        </div>

        <div class="appbar">
            <button class="icon-btn back" onclick="history.back()">‹</button>
            <div class="title">服务器设置</div>
        </div>

        <div class="content">
            <div class="field">
                <label>服务地址</label>
                <input class="input" value="http://10.0.2.2:8080" placeholder="如 http://10.0.2.2:8080" />
            </div>

            <div class="row gap-8 mt-12">
                <button class="btn outline full" onclick="App.toast('连接成功(模拟)')">测试连接</button>
                <button class="btn outline grey full" onclick="App.toast('已恢复默认')">恢复默认</button>
            </div>

            <button class="btn full lg mt-16" onclick="App.toast('已保存'); setTimeout(()=>history.back(),600);">保存</button>

            <div class="card mt-16">
                <div class="caption" style="line-height:1.7;">
                    保存后下次启动会使用新地址。<br>
                    原型阶段即使填错也不影响 mock 数据。<br>
                    格式示例:<span style="color:var(--primary);">http://192.168.1.10:8080</span>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="../js/app.js"></script>
</body>
</html>
