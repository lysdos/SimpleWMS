# mysql profile:Docker 容器内使用(SPRING_PROFILES_ACTIVE=mysql)。
# 现在默认 profile 也已直连 MySQL,本 profile 只保留容器内的差异项:
#   - hikari 连接初始化 SET NAMES utf8mb4
#   - 连接信息仍统一从环境变量传入(docker-compose 注入服务名 mysql:3306)

spring:
  datasource:
    # 关键:连接建立后立刻 SET NAMES utf8mb4,强制 client/connection/results 都是 utf8mb4
    # (MySQL 8 在 docker 镜像里默认 character_set_client=latin1,会导致中文 mojibake)
    hikari:
      connection-init-sql: "SET NAMES utf8mb4"
