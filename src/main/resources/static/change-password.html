<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>修改密码 - SimpleWMS</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body class="login-page">
<main class="login-card">
    <h1>📦 SimpleWMS</h1>
    <p class="subtitle">首次登录请修改密码</p>
    <form id="cp-form">
        <label>原密码<input id="old" type="password" required></label>
        <label>新密码(至少 6 位)<input id="new" type="password" minlength="6" required></label>
        <label>确认新密码<input id="new2" type="password" minlength="6" required></label>
        <button type="submit" class="btn btn-primary">保存</button>
        <div id="cp-error" class="error" hidden></div>
    </form>
</main>
<script src="/js/auth.js"></script>
<script>
document.getElementById('cp-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const err = document.getElementById('cp-error');
    err.hidden = true;
    const oldPw = document.getElementById('old').value;
    const newPw = document.getElementById('new').value;
    const newPw2 = document.getElementById('new2').value;
    if (newPw !== newPw2) { err.textContent = '两次输入不一致'; err.hidden = false; return; }
    try {
        await Auth.changeOwnPassword(oldPw, newPw);
        location.href = '/';
    } catch (msg) {
        err.textContent = msg;
        err.hidden = false;
    }
});
</script>
</body>
</html>
