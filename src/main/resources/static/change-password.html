<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="cp.title">修改密码 - SimpleWMS</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body class="login-page">
<main class="login-card">
    <div class="logo-icon">🔒</div>
    <h1>SimpleWMS</h1>
    <p class="subtitle" data-i18n="cp.subtitle">首次登录请修改密码</p>
    <form id="cp-form" autocomplete="off">
        <label>
            <span data-i18n="cp.old">原密码</span>
            <input id="old" type="password" required>
        </label>
        <label>
            <span data-i18n="cp.new">新密码(至少 6 位)</span>
            <input id="new" type="password" minlength="6" required>
        </label>
        <label>
            <span data-i18n="cp.new2">确认新密码</span>
            <input id="new2" type="password" minlength="6" required>
        </label>
        <button type="submit" class="btn btn-primary" data-i18n="cp.submit">保存</button>
        <div id="cp-error" class="error" hidden></div>
    </form>
    <div class="lang-row" id="lang-switch" data-i18n-title="login.lang.toggle" title="切换语言">
        <button type="button" data-lang="zh-CN">中文</button>
        <button type="button" data-lang="en-US">English</button>
    </div>
</main>

<script src="/js/i18n.js"></script>
<script src="/js/auth.js"></script>
<script>
I18N.applyI18n(document);
function refreshLangButtons() {
    document.querySelectorAll('#lang-switch button').forEach(b => {
        b.classList.toggle('active', b.dataset.lang === I18N.getLang());
    });
}
refreshLangButtons();
document.getElementById('lang-switch').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-lang]');
    if (!b) return;
    I18N.setLang(b.dataset.lang);
});

document.getElementById('cp-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const err = document.getElementById('cp-error');
    err.hidden = true;
    const oldPw  = document.getElementById('old').value;
    const newPw  = document.getElementById('new').value;
    const newPw2 = document.getElementById('new2').value;
    if (newPw !== newPw2) {
        err.textContent = I18N.t('cp.error.mismatch');
        err.hidden = false;
        return;
    }
    try {
        await Auth.changeOwnPassword(oldPw, newPw);
        location.href = '/';
    } catch (msg) {
        err.textContent = msg;
        err.hidden = false;
    }
});
</script>
</body>
</html>
