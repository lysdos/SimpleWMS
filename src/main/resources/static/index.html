<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SimpleWMS - 简单仓库管理系统</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>

<header class="app-header">
    <div class="brand">
        <span class="logo">📦</span>
        <span class="title">SimpleWMS</span>
        <span class="subtitle">简单仓库管理系统</span>
    </div>
    <nav class="nav" id="nav">
        <a class="nav-item" data-route="dashboard" data-roles="ADMIN,OPERATOR" href="#/dashboard"><span class="nav-icon">📊</span>仪表盘</a>
        <a class="nav-item" data-route="inbound"   data-roles="ADMIN,OPERATOR" href="#/inbound"><span class="nav-icon">📥</span>入库登记</a>
        <a class="nav-item" data-route="outbound"  data-roles="ADMIN,OPERATOR" href="#/outbound"><span class="nav-icon">📤</span>出库登记</a>
        <a class="nav-item" data-route="orders"    data-roles="ADMIN,OPERATOR" href="#/orders"><span class="nav-icon">📋</span>出入库单</a>
        <a class="nav-item" data-route="inventory" data-roles="ADMIN,OPERATOR" href="#/inventory"><span class="nav-icon">📦</span>库存管理</a>
        <a class="nav-item" data-route="stock-checks" data-roles="ADMIN"             href="#/stock-checks"><span class="nav-icon">🔍</span>库存盘点</a>

        <!-- 基础管理(下拉) -->
        <div class="nav-group" data-roles="ADMIN">
            <a class="nav-item nav-parent" href="javascript:void(0)" id="nav-basic"><span class="nav-icon">⚙</span>基础管理 <span class="caret">▾</span></a>
            <div class="nav-dropdown" id="nav-basic-dropdown">
                <a class="nav-item" data-route="products"  data-roles="ADMIN" href="#/products"><span class="nav-icon">🏷</span>商品管理</a>
                <a class="nav-item" data-route="suppliers" data-roles="ADMIN" href="#/suppliers"><span class="nav-icon">🤝</span>供应商管理</a>
                <a class="nav-item" data-route="locations" data-roles="ADMIN" href="#/locations"><span class="nav-icon">🗂</span>库位管理</a>
                <a class="nav-item" data-route="users"     data-roles="ADMIN" href="#/users"><span class="nav-icon">👥</span>用户管理</a>
            </div>
        </div>
    </nav>
    <div class="user-area">
        <span id="me-name" class="user"></span>
        <button id="logout-btn" class="btn btn-sm" hidden>登出</button>
    </div>
</header>

<main id="view" class="view"></main>

<!-- 通用 Modal -->
<div class="modal-mask" id="modal-mask" hidden>
    <div class="modal" role="dialog" aria-modal="true">
        <div class="modal-head">
            <span id="modal-title">标题</span>
            <button class="icon-btn" onclick="closeModal()" aria-label="关闭">×</button>
        </div>
        <div class="modal-body" id="modal-body"></div>
        <div class="modal-foot">
            <button class="btn" onclick="closeModal()">取消</button>
            <button class="btn btn-primary" id="modal-ok">确定</button>
        </div>
    </div>
</div>

<!-- Toast -->
<div id="toast" class="toast" hidden></div>

<script src="/js/auth.js"></script>
<script src="/js/api.js"></script>
<script src="/js/views.js"></script>
<script src="/js/views/userAdmin.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
